packages:
  - 'extensions/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  electron: true
  electron-winstaller: false
  esbuild: true
  node-pty: true
  unrs-resolver: true

catalog:
  '@types/semver': ^7.8.0
  '@types/ws': ^8.18.1
  '@yutengjing/eslint-config-typescript': ^4.0.0
  '@yutengjing/prettier-config': ^2.0.0
  markdownlint: ^0.41.1
  markdownlint-cli2: ^0.23.2
  oxlint: ^1.78.0
  oxlint-tsgolint: ^7.0.2001
  prettier-plugin-tailwindcss: ^0.8.1
  semver: ^7.8.5
  sonda: ^0.14.0
  ws: ^8.21.3
  zod: 4.4.3

minimumReleaseAgeExclude:
  - '@yutengjing/eslint-config-basic@4.0.0'
  - '@yutengjing/eslint-config-typescript@4.0.0'
  - '@yutengjing/eslint-plugin@4.0.0'
  - eslint-plugin-jsdoc@64.2.0
  - '@yutengjing/vscode-icons'

overrides:
  dompurify: 3.4.13

patchedDependencies:
  app-builder-lib: patches/app-builder-lib.patch
