packages:
  - 'apps/*'
  - 'extensions/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  electron: true
  electron-winstaller: false
  esbuild: true
  node-pty: true
  unrs-resolver: true

catalog:
  '@ronradtke/react-native-markdown-display': ^9.0.3
  '@tanstack/react-query': ^5.104.5
  '@types/semver': ^7.8.0
  '@types/ws': ^8.18.2
  '@yutengjing/eslint-config-typescript': ^4.0.0
  eslint-plugin-import-x: ^4.17.1
  expo-file-system: ~58.0.10
  expo-image-manipulator: ~58.0.15
  expo-image-picker: ~58.0.10
  expo-intent-launcher: ~58.0.3
  lucide-react-native: ^1.59.0
  markdownlint: ^0.42.0
  markdownlint-cli2: ^0.23.3
  oxlint: ^1.89.0
  oxlint-tsgolint: ^7.0.2004
  prism-react-renderer: ^2.4.1
  react-qr-code: ^2.2.0
  react-scan: ^0.5.7
  semver: ^7.8.5
  sonda: ^0.14.0
  ws: ^8.22.0
  zod: ^4.6.7

# CI's pnpm applies its default one-day release-age floor. Declaring it here keeps a contributor's user-level
# `minimumReleaseAge` override from resolving a lockfile that CI's frozen install then rejects.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  # Each entry is one exact version a dependency upgrade needed before it was a day old. Remove an entry once the
  # lockfile no longer resolves that version; `scripts/__tests__/toolchain-contract.test.ts` fails on a stale or
  # unversioned entry, because an unversioned one exempts every future release.
  # The maintainer's own lint config and icon packages, released together with the change that adopts them.
  - '@yutengjing/eslint-config-basic@4.0.0'
  - '@yutengjing/eslint-config-typescript@4.0.0'
  - '@yutengjing/eslint-plugin@4.0.0'
  - '@yutengjing/vscode-icons@0.2.0'
  # The DOMPurify security floor below must take a fix the day it ships.
  - dompurify@3.4.17

overrides:
  # Security floor for DOMPurify, not a compatibility pin. It is both monaco-editor's transitive dependency and, since
  # the Markdown preview landed, the Renderer's direct XSS boundary, so this line must keep up with the newest release
  # rather than hold a floor: an override always wins over `apps/desktop`'s declared range.
  # Exact (not ^) per stack-baseline override policy; 3.4.8–3.4.14 closed
  # GHSA-vxr8-fq34-vvx9, GHSA-cmwh-pvxp-8882, GHSA-c2j3-45gr-mqc4, and GHSA-55q2-fjhq-7xh7.
  # https://github.com/advisories/GHSA-55q2-fjhq-7xh7
  dompurify: 3.4.17
  # Vitest still pins a tinybench release whose declarations require DOM types in Node projects, so
  # `packages/agent-skills` fails to typecheck on `DOMHighResTimeStamp`.
  # Deliberately keyed on `vitest` with no version: the previous `vitest@5.0.0>tinybench` key stopped
  # matching the moment Vitest went to 5.0.1, silently letting the broken declarations back in.
  # https://github.com/tinylibs/tinybench/releases/tag/v6.1.6
  'vitest>tinybench': 6.2.2
  # Security floor for mermaid's chevrotain packages, which still resolve lodash-es 4.17.23 (high: `_.template` code
  # injection and `_.unset` prototype pollution). 4.18.1 is the same major and drop-in for chevrotain's imports.
  # https://github.com/advisories/GHSA-r5fr-rjxr-66jc
  lodash-es: 4.18.1
  # drizzle-kit's deprecated @esbuild-kit loader pins esbuild ~0.18, below the dev-server CORS fix (GHSA-67mh-4wv8-2f99).
  # The loader only calls esbuild's stable transform API, which 0.25 keeps; drizzle-kit is a dev-only generator.
  # https://github.com/advisories/GHSA-67mh-4wv8-2f99
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # Expo's xcode project editor still asks for uuid ^7 and only calls the CommonJS `uuid.v4()` export. 11.1.1 is the
  # last CommonJS-compatible line with the buffer bounds fix (GHSA-w5hq-g745-h8pq); 12+ is ESM-only.
  # https://github.com/advisories/GHSA-w5hq-g745-h8pq
  'xcode>uuid': 11.1.1
  # react-devtools-core accepts shell-quote ^1.6.1. Pin the first release that rejects line terminators after comment
  # tokens, without taking 1.12.0's unrelated parse changes on the REACT_EDITOR command path.
  # https://github.com/advisories/GHSA-pqg4-j6r4-53mv
  'react-devtools-core>shell-quote': 1.11.0
  # react-scan declares react-doctor through the floating `latest` tag. Keep the already-reviewed 0.9.18 toolchain
  # until a dedicated react-doctor upgrade can validate its binary and plugin changes.
  'react-scan>react-doctor': 0.9.18
  # Electron Builder's download path accepts http-cache-semantics 4.x. GitHub still marks <=4.2.0 as vulnerable,
  # while upstream disputes the max-stale report; 4.3.0 exits the advisory range and includes later cache fixes.
  # https://github.com/advisories/GHSA-ch52-4w7c-c8xp
  # https://github.com/kornelski/http-cache-semantics/issues/56
  http-cache-semantics: 4.3.0
  # source-map-js 1.2.1 can spend unbounded time validating attacker-controlled indexed source-map offsets.
  # Every current consumer accepts 1.x, and 1.2.2 is the upstream patched release.
  # https://github.com/advisories/GHSA-68fv-2mgg-jv7q
  source-map-js: 1.2.2

auditConfig:
  ignoreGhsas:
    # decode-uri-component DoS via malformed percent-encoding. Only reached through Expo's dev-time router tooling
    # (`@expo/cli` → `expo-router` → query-string 7). The fix ships in 0.5.0, which is ESM-only and breaks
    # query-string 7's CommonJS `require('decode-uri-component')` call, so it cannot be overridden safely.
    # Revisit when Expo moves expo-router to query-string 8+ or an Expo SDK major upgrade lands.
    - GHSA-vcc3-ghjq-m6fr
    # node-forge 1.4.0 is patched locally with the exact nested DigestAlgorithm validation from upstream PR #1152.
    # pnpm audits the published version rather than patched bytes. Remove this exception and the patch together when
    # node-forge publishes a version outside the advisory range or Expo moves off 1.4.0, whichever happens first.
    # https://github.com/digitalbazaar/forge/pull/1152
    - GHSA-86w9-cpqp-85rv
    # braces 3.0.3 is patched locally from upstream PR #72 to reject nesting deeper than 100 before recursive walks.
    # pnpm audits the published version rather than patched bytes. Remove this exception and the patch together when
    # braces publishes a version outside the advisory range or Expo/React Native moves off 3.0.3, whichever is first.
    # https://github.com/micromatch/braces/pull/72
    - GHSA-vfj7-8cjw-p6xm

patchedDependencies:
  app-builder-lib: patches/app-builder-lib.patch
  # Bound recursive brace parsing before compile/expand/stringify can exhaust the Node.js stack.
  # https://github.com/micromatch/braces/pull/72
  braces@3.0.3: patches/braces@3.0.3.patch
  # Reject extra children inside RSA PKCS#1 v1.5 DigestAlgorithm sequences.
  # https://github.com/digitalbazaar/forge/pull/1152
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
  # Keep the embedded Terminal WebView offline before page configuration or content loading.
  # https://developer.android.com/reference/android/webkit/WebSettings#setBlockNetworkLoads(boolean)
  # Also restores the `WebView<P = {}>` declaration default: 14.0.1 declares `P = undefined`, so
  # `WebViewProps & P` collapses to `never` and every `<WebView>` element fails to typecheck. 16.0.0 restores `{}`;
  # drop this hunk when Expo's SDK pin moves past 14.
  react-native-webview@14.0.1: patches/react-native-webview.patch
  # Preserve timer pause accounting across an open reminder menu's Infinity duration, and let the
  # host refuse the Toaster's focus restoration while a dialog opened from a toast action owns focus.
  # https://github.com/emilkowalski/sonner/pull/533
  sonner@2.0.8: patches/sonner.patch
  # Clip stale alternate-buffer cells and preserve the full-row cursor during screen recovery.
  # https://github.com/xtermjs/xterm.js/issues/6165
  '@xterm/addon-serialize@0.15.0-beta.310': patches/xterm-addon-serialize.patch
  node-pty@1.1.0: patches/node-pty@1.1.0.patch
