name: Setup Caxri job
description: Prepare the trusted self-hosted runner and install the requested Caxri toolchain.

inputs:
  setup-toolchain:
    description: Install the repository pnpm and Node.js versions.
    required: false
    default: 'false'
  install-dependencies:
    description: Install the lockfile dependency tree without lifecycle scripts.
    required: false
    default: 'false'
  install-electron:
    description: Install the Electron binary after dependency installation.
    required: false
    default: 'false'
  rebuild-native:
    description: Rebuild Electron native modules after dependency installation.
    required: false
    default: 'false'

outputs:
  prepared:
    description: Whether the self-hosted runner boundary was prepared.
    value: ${{ steps.prepare.outputs.prepared }}

runs:
  using: composite
  steps:
    - name: Setup exact Node.js
      if: inputs.setup-toolchain == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: 24.19.0
        package-manager-cache: false

    - id: pnpm_toolchain
      name: Reuse runner-cached pnpm
      if: inputs.setup-toolchain == 'true'
      shell: bash
      run: |
        pnpm_directory="$RUNNER_TOOL_CACHE/caxri/pnpm/12.0.0-rc.5-node-24.19.0"
        if [[ -x "$pnpm_directory/pnpm" ]] && [[ "$("$pnpm_directory/pnpm" --version)" == "12.0.0-rc.5" ]]; then
          echo "cached=true" >> "$GITHUB_OUTPUT"
          echo "PNPM_HOME=$pnpm_directory" >> "$GITHUB_ENV"
          echo "$pnpm_directory" >> "$GITHUB_PATH"
        else
          echo "cached=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install pnpm on cache miss
      if: inputs.setup-toolchain == 'true' && steps.pnpm_toolchain.outputs.cached != 'true'
      uses: pnpm/setup@v2
      with:
        version: 12.0.0-rc.5
        dest: ${{ runner.tool_cache }}/caxri/pnpm/12.0.0-rc.5-node-24.19.0
        install: false
        cache: false

    - name: Verify exact Node.js and pnpm
      if: inputs.setup-toolchain == 'true'
      shell: bash
      run: |
        test "$(node --version)" = "v24.19.0"
        test "$(pnpm --version)" = "12.0.0-rc.5"

    - name: Use runner-pinned Bun
      shell: bash
      run: |
        bun_version="$(tr -d '\r\n' < .bun-version)"
        [[ "$bun_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        bun_directory="$RUNNER_TOOL_CACHE/caxri/bun/$bun_version/bin"
        test -x "$bun_directory/bun"
        test "$("$bun_directory/bun" --version)" = "$bun_version"
        echo "$bun_directory" >> "$GITHUB_PATH"

    - id: prepare
      name: Prepare self-hosted runner boundary
      shell: bash
      run: |
        bun run scripts/self-hosted-runner.ts prepare
        echo "prepared=true" >> "$GITHUB_OUTPUT"

    - name: Configure runner-local caches
      if: inputs.setup-toolchain == 'true'
      shell: bash
      run: |
        cache_root="$RUNNER_TOOL_CACHE/caxri"
        electron_cache="$cache_root/electron"
        pnpm_store="$cache_root/pnpm-store"

        pnpm_state=cold
        electron_state=cold
        quality_state=cold
        if [[ -d "$pnpm_store" ]] && find "$pnpm_store" -mindepth 1 -print -quit | grep -q .; then
          pnpm_state=warm
        fi
        if [[ -d "$electron_cache" ]] && find "$electron_cache" -mindepth 1 -print -quit | grep -q .; then
          electron_state=warm
        fi
        if [[ -e "$cache_root/eslint/.eslintcache" || -e "$cache_root/prettier" ]]; then
          quality_state=warm
        fi

        CAXRI_PNPM_CACHE_STATE="$pnpm_state" \
          CAXRI_ELECTRON_CACHE_STATE="$electron_state" \
          CAXRI_QUALITY_CACHE_STATE="$quality_state" \
          node -e 'console.log(`CAXRI_CACHE_STATE ${JSON.stringify({ electron: process.env.CAXRI_ELECTRON_CACHE_STATE, pnpm: process.env.CAXRI_PNPM_CACHE_STATE, quality: process.env.CAXRI_QUALITY_CACHE_STATE })}`)'

        test ! -e .cache
        mkdir -p "$electron_cache" "$pnpm_store" "$cache_root/eslint" .cache
        if [[ ! -s "$cache_root/prettier" ]]; then
          rm -f "$cache_root/prettier"
        fi
        ln -s "$cache_root/eslint" .cache/eslint
        ln -s "$cache_root/prettier" .cache/prettier
        echo "ELECTRON_CACHE=$electron_cache" >> "$GITHUB_ENV"
        echo "PNPM_CONFIG_STORE_DIR=$pnpm_store" >> "$GITHUB_ENV"

        {
          echo "## Runner-local cache state"
          echo
          echo "| Cache | State |"
          echo "| --- | --- |"
          echo "| pnpm store | $pnpm_state |"
          echo "| Electron | $electron_state |"
          echo "| ESLint / Prettier | $quality_state |"
          echo
          echo "## Command metrics"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Install dependency tree without lifecycle scripts
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: >-
        bun run scripts/ci-metrics.ts --label "pnpm registry, unpack, and link" --
        pnpm install --frozen-lockfile --ignore-scripts --prefer-offline --no-runtime

    - name: Install Electron binary
      if: inputs.install-electron == 'true'
      shell: bash
      run: bun run scripts/ci-metrics.ts --label "Electron download" -- pnpm rebuild electron

    - name: Rebuild Electron native modules
      if: inputs.rebuild-native == 'true'
      shell: bash
      run: bun run scripts/ci-metrics.ts --label "Electron native rebuild" -- bun run rebuild
