name: Setup Caxri job
description: Install the exact Caxri toolchain on disposable GitHub-hosted runners.

inputs:
  setup-toolchain:
    description: Install the repository pnpm and Node.js versions.
    required: false
    default: 'false'
  install-dependencies:
    description: Install the lockfile dependency tree without lifecycle scripts.
    required: false
    default: 'false'
  install-electron:
    description: Install the Electron binary after dependency installation.
    required: false
    default: 'false'
  install-playwright-shell:
    description: Install the Playwright Chromium headless shell for browser-backed Vitest contracts.
    required: false
    default: 'false'
  install-media-tools:
    description: Install or verify FFmpeg and FFprobe for capture and media-analysis contracts.
    required: false
    default: 'false'
  install-android-toolchain:
    description: Install and verify the exact Android JDK, SDK, NDK, and CMake toolchain.
    required: false
    default: 'false'
  gradle-cache:
    description: Restore and save Gradle dependencies, wrapper distributions, and task outputs across runs.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Verify GitHub-hosted runner boundary
      shell: bash
      run: test "$RUNNER_ENVIRONMENT" = github-hosted

    - id: tool_versions
      name: Read mise tool versions
      if: inputs.setup-toolchain == 'true'
      shell: bash
      run: |
        read_tool_version() {
          sed -nE "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*\"([^\"]+)\"[[:space:]]*$/\1/p" mise.toml
        }

        node_version="$(read_tool_version node)"
        pnpm_version="$(read_tool_version pnpm)"
        [[ "$node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
        [[ "$pnpm_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
        echo "node=$node_version" >> "$GITHUB_OUTPUT"
        echo "pnpm=$pnpm_version" >> "$GITHUB_OUTPUT"

    - name: Setup exact Node.js
      if: inputs.setup-toolchain == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ steps.tool_versions.outputs.node }}
        package-manager-cache: false

    - name: Install exact pnpm
      if: inputs.setup-toolchain == 'true'
      uses: pnpm/setup@c8e77b72cd6022852162c92aa10e7e72b7209c9b # v2
      with:
        version: ${{ steps.tool_versions.outputs.pnpm }}
        dest: ${{ runner.temp }}/caxri-pnpm
        install: false
        cache: false

    - name: Verify exact Node.js and pnpm
      if: inputs.setup-toolchain == 'true'
      shell: bash
      env:
        CAXRI_NODE_VERSION: ${{ steps.tool_versions.outputs.node }}
        CAXRI_PNPM_VERSION: ${{ steps.tool_versions.outputs.pnpm }}
      run: |
        test "$(node --version)" = "v$CAXRI_NODE_VERSION"
        test "$(pnpm --version)" = "$CAXRI_PNPM_VERSION"

    - name: Install exact Bun
      shell: bash
      run: |
        bun_version="$(tr -d '\r\n' < .bun-version)"
        [[ "$bun_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        npm install --global --no-audit --no-fund "bun@$bun_version"

    - name: Verify exact Bun
      shell: bash
      run: test "$(bun --version)" = "$(tr -d '\r\n' < .bun-version)"

    - name: Configure disposable hosted caches
      if: inputs.setup-toolchain == 'true'
      shell: bash
      run: |
        cache_root="$RUNNER_TEMP/caxri"
        mkdir -p "$cache_root/electron" "$cache_root/playwright" "$cache_root/pnpm-store" .cache/eslint
        echo "ELECTRON_CACHE=$cache_root/electron" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_BROWSERS_PATH=$cache_root/playwright" >> "$GITHUB_ENV"
        echo "PNPM_CONFIG_STORE_DIR=$cache_root/pnpm-store" >> "$GITHUB_ENV"
        echo "CAXRI_CACHE_ROOT=$cache_root" >> "$GITHUB_ENV"

    - name: Install exact Android toolchain
      if: inputs.install-android-toolchain == 'true'
      shell: bash
      run: |
        test "$RUNNER_OS" = macOS
        java_home="${JAVA_HOME_17_arm64:-}"
        test -n "$java_home"
        "$java_home/bin/java" -version 2>&1 | grep -q 'version "17\.'
        sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
        test -n "$sdk_root"
        sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
        test -x "$sdkmanager"
        JAVA_HOME="$java_home" "$sdkmanager" \
          "build-tools;35.0.0" \
          "build-tools;36.0.0" \
          "cmake;3.22.1" \
          "ndk;27.1.12297006" \
          "platforms;android-36"
        test -x "$sdk_root/cmake/3.22.1/bin/cmake"
        test -x "$sdk_root/cmake/3.22.1/bin/ninja"
        test -d "$sdk_root/ndk/27.1.12297006"
        echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
        echo "$java_home/bin" >> "$GITHUB_PATH"

    # A cold Android release build spends most of its 19 minutes resolving dependencies, compiling Gradle plugins,
    # and re-running cacheable Kotlin, Java, and R8 tasks. Only workflows running on main can write a cache that
    # main-triggered release jobs restore; pull-request caches are scoped to their own ref. See
    # https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#restrictions-for-accessing-a-cache
    - name: Enable the Gradle build cache
      if: inputs.gradle-cache == 'true'
      shell: bash
      run: |
        mkdir -p "$HOME/.gradle"
        echo 'org.gradle.caching=true' >> "$HOME/.gradle/gradle.properties"
        # R8 spent 3.6 of a warm 10-minute release build inside the project's 2 GiB heap; the 7 GiB macos-15 runner
        # has room for more. Gradle-home properties override the project's gradle.properties.
        echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' >> "$HOME/.gradle/gradle.properties"

    # The Gradle build cache does not cover CMake: the worklets, reanimated, expo-modules-core, and app native
    # libraries recompiled from scratch for about four minutes of every warm release build. CMake 3.17+ reads the
    # compiler launcher from these variables for every project AGP configures, including third-party libraries.
    - name: Enable the native compiler cache
      if: inputs.gradle-cache == 'true'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_INSTALL_CLEANUP: '1'
      run: |
        brew install ccache
        {
          echo "CCACHE_DIR=$HOME/.ccache"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo 'CCACHE_COMPILERCHECK=content'
          echo 'CCACHE_MAXSIZE=2G'
          echo 'CCACHE_NOHASHDIR=true'
          echo 'CMAKE_C_COMPILER_LAUNCHER=ccache'
          echo 'CMAKE_CXX_COMPILER_LAUNCHER=ccache'
        } >> "$GITHUB_ENV"

    - name: Cache Gradle home
      if: inputs.gradle-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}
        restore-keys: |
          gradle-${{ runner.os }}-${{ runner.arch }}-

    # Unlike the Gradle home, the compiler cache is keyed per run so each release refreshes it from the previous one;
    # ccache evicts beyond CCACHE_MAXSIZE.
    - name: Cache native compiler output
      if: inputs.gradle-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.ccache
        key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ runner.arch }}-

    - name: Install media tools on hosted runner
      if: inputs.install-media-tools == 'true'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: >-
        bun run scripts/ci-metrics.ts --label "FFmpeg install" --
        brew install ffmpeg

    - name: Verify media tools
      if: inputs.install-media-tools == 'true'
      shell: bash
      run: |
        command -v ffmpeg
        command -v ffprobe
        ffmpeg -hide_banner -encoders 2>/dev/null | grep -q '[[:space:]]libx264[[:space:]]'

    - name: Install dependency tree without lifecycle scripts
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: >-
        bun run scripts/ci-metrics.ts --label "pnpm registry, unpack, and link" --
        pnpm install --frozen-lockfile --ignore-scripts --prefer-offline --no-runtime

    - name: Prepare node-pty spawn helper
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: bun run scripts/prepare-node-pty.ts

    - name: Install Electron binary
      if: inputs.install-electron == 'true'
      shell: bash
      run: bun run scripts/ci-metrics.ts --label "Electron download" -- bun run electron:install

    - name: Install Playwright Chromium headless shell
      if: inputs.install-playwright-shell == 'true'
      shell: bash
      run: >-
        bun run scripts/ci-metrics.ts --label "Playwright Chromium headless shell" --
        bunx --bun playwright install chromium-headless-shell
