name: Verify trust boundary
description: Recheck the repository-owned actor and event policy before executing source code.

inputs:
  policy-domain:
    description: Policy section whose event rules must be enforced.
    required: true
  event-name:
    description: Event name whose trust policy must be enforced.
    required: true
  actor:
    description: Actor that initiated the event.
    required: true
  triggering-actor:
    description: Actor that triggered the current workflow attempt.
    required: true
  event-repository:
    description: Repository that supplied the event head.
    required: true
  event-ref:
    description: Fully qualified ref for push-style events.
    required: true
  pull-request-author:
    description: Pull request author, or the event actor for non-PR events.
    required: true
  allow-external-pull-request:
    description: Allow an untrusted fork pull request in a read-only GitHub-hosted job.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        EVENT_ACTOR: ${{ inputs.actor }}
        EVENT_NAME: ${{ inputs.event-name }}
        EVENT_REF: ${{ inputs.event-ref }}
        EVENT_REPOSITORY: ${{ inputs.event-repository }}
        POLICY_DOMAIN: ${{ inputs.policy-domain }}
        PR_AUTHOR: ${{ inputs.pull-request-author }}
        TRIGGERING_ACTOR: ${{ inputs.triggering-actor }}
        ALLOW_EXTERNAL_PULL_REQUEST: ${{ inputs.allow-external-pull-request }}
      run: |
        policy=.github/ci-trust-policy.json
        trusted_actor="$(sed -nE 's/^[[:space:]]*"trustedActor":[[:space:]]*"([^"]+)".*/\1/p' "$policy")"
        pull_request_event="$(sed -nE 's/^[[:space:]]*"pullRequestEvent":[[:space:]]*"([^"]+)".*/\1/p' "$policy")"
        workflow_dispatch_event="$(sed -nE 's/^[[:space:]]*"workflowDispatchEvent":[[:space:]]*"([^"]+)".*/\1/p' "$policy")"
        push_event="$(sed -nE 's/^[[:space:]]*"pushEvent":[[:space:]]*"([^"]+)".*/\1/p' "$policy")"
        schedule_event="$(sed -nE 's/^[[:space:]]*"scheduleEvent":[[:space:]]*"([^"]+)".*/\1/p' "$policy")"
        push_ref="$(sed -nE 's/^[[:space:]]*"pushRef":[[:space:]]*"([^"]+)".*/\1/p' "$policy")"
        release_branch="$(sed -nE 's/^[[:space:]]*"branch":[[:space:]]*"([^"]+)".*/\1/p' "$policy")"

        test -n "$trusted_actor"
        test -n "$pull_request_event"
        test -n "$workflow_dispatch_event"
        test -n "$push_event"
        test -n "$push_ref"
        test -n "$schedule_event"
        test -n "$release_branch"
        test "$POLICY_DOMAIN" = ci || test "$POLICY_DOMAIN" = release
        external_pull_request=false
        if [[ "$POLICY_DOMAIN" == ci && "$EVENT_NAME" == "$pull_request_event" && "$EVENT_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
          external_pull_request=true
        fi

        if [[ "$external_pull_request" == true ]]; then
          test "$ALLOW_EXTERNAL_PULL_REQUEST" = true
        else
          test "$EVENT_ACTOR" = "$trusted_actor"
          test "$TRIGGERING_ACTOR" = "$trusted_actor"
          test "$EVENT_REPOSITORY" = "$GITHUB_REPOSITORY"
        fi

        if [[ "$EVENT_NAME" == "$pull_request_event" ]]; then
          test "$POLICY_DOMAIN" = ci
          if [[ "$external_pull_request" != true ]]; then
            test "$PR_AUTHOR" = "$trusted_actor"
          fi
        elif [[ "$EVENT_NAME" == "$push_event" ]]; then
          if [[ "$POLICY_DOMAIN" == release ]]; then
            test "$EVENT_REF" = "refs/heads/$release_branch"
          else
            test "$EVENT_REF" = "$push_ref"
          fi
        elif [[ "$EVENT_NAME" == "$schedule_event" ]]; then
          test "$POLICY_DOMAIN" = ci
          test "$EVENT_REF" = "$push_ref"
        else
          test "$POLICY_DOMAIN" = ci
          test "$EVENT_NAME" = "$workflow_dispatch_event"
        fi
