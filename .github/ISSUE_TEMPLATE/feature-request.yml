name: Feature request
description: Suggest a focused improvement to Caxri.
title: ''
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome, but submission does not guarantee a response, implementation, or timeline. Do not include private project data or sensitive information.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing Issues for the same request.
          required: true
        - label: This request contains no sensitive or private information.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user workflow and the friction it creates today.
      placeholder: When I..., I cannot..., which means...
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result rather than a specific implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any current workaround or other approach you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add non-sensitive screenshots, references, or examples when useful.
