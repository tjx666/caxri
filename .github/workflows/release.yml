name: Release macOS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    # CI already owns every quality gate and the full macOS E2E suite. Wait for that workflow so
    # release commits consume one E2E runner instead of executing the same suite twice.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.display_title, 'release: v')
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2

      - name: Validate release commit
        id: release
        env:
          RELEASE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          subject="$(git show -s --format=%s "$RELEASE_COMMIT_SHA")"
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          expected="release: ${tag}"

          if [[ "$subject" != "$expected" ]]; then
            echo "Expected commit subject '${expected}', received '${subject}'." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag '${tag}' already exists." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Package unsigned Apple Silicon DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: bun run package:dmg -- --arm64

      - name: Verify packaged application
        env:
          CAXRI_BENCHMARK_EXECUTABLE: ${{ github.workspace }}/release/mac-arm64/Caxri.app/Contents/MacOS/Caxri
          CAXRI_BENCHMARK_PROJECT_ROOT: ${{ github.workspace }}
          CAXRI_PACKAGED_EXECUTABLE: ${{ github.workspace }}/release/mac-arm64/Caxri.app/Contents/MacOS/Caxri
        run: |
          file "$CAXRI_BENCHMARK_EXECUTABLE" | grep -q 'arm64'
          bunx playwright test e2e/startup.performance.e2e.ts e2e/agent-login-path.e2e.ts --reporter=line

      - name: Verify release artifact
        id: artifact
        run: |
          dmg="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "No DMG was produced." >&2
            exit 1
          fi

          hdiutil verify "$dmg"
          dmg_directory="$(dirname "$dmg")"
          dmg_name="$(basename "$dmg")"
          (cd "$dmg_directory" && shasum -a 256 "$dmg_name" > "${dmg_name}.sha256")

          echo "dmg=${dmg}" >> "$GITHUB_OUTPUT"
          echo "checksum=${dmg}.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_DMG: ${{ steps.artifact.outputs.dmg }}
          RELEASE_CHECKSUM: ${{ steps.artifact.outputs.checksum }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RELEASE_DMG" \
            "$RELEASE_CHECKSUM" \
            --target "$RELEASE_TARGET_SHA" \
            --title "Caxri ${RELEASE_TAG}" \
            --generate-notes \
            --fail-on-no-commits
