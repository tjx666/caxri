name: Release macOS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Rehearses the hosted Linux natives and unsigned macOS package on main without publishing a Release.
  workflow_dispatch:
    inputs:
      android_release_tag:
        description: 'Existing published tag to backfill with an Android APK; leave empty for the no-publish rehearsal'
        type: string
        default: ''

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  # SSH Host Servers need node-pty and better-sqlite3 built against glibc 2.28 (ADR 0014). The macOS release runner
  # has no Docker, so each architecture builds natively on a disposable GitHub-hosted Linux runner, running the same
  # manylinux_2_28 container step as a local build (`apps/server/scripts/linux-target.ts`). The job reads no secrets
  # and only uploads the two addons plus their input key; the packaging job refuses them if its own key differs.
  linux-natives:
    name: Linux natives (${{ matrix.target }})
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      inputs.android_release_tag == '' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'tjx666' &&
      github.triggering_actor == 'tjx666') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == 'tjx666' &&
      github.event.workflow_run.triggering_actor.login == 'tjx666' &&
      startsWith(github.event.workflow_run.display_title, 'release: v'))
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - id: tool_versions
        name: Read pnpm and Node.js versions
        run: |
          read_tool_version() {
            sed -nE "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*\"([^\"]+)\"[[:space:]]*$/\1/p" mise.toml
          }
          node_version="$(read_tool_version node)"
          pnpm_version="$(read_tool_version pnpm)"
          [[ "$node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$pnpm_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          echo "node=$node_version" >> "$GITHUB_OUTPUT"
          echo "pnpm=$pnpm_version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@c8e77b72cd6022852162c92aa10e7e72b7209c9b # v2
        with:
          version: ${{ steps.tool_versions.outputs.pnpm }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.tool_versions.outputs.node }}
          package-manager-cache: false

      # The Actions allowlist admits only GitHub-owned actions and `pnpm/setup` (see guards.yml), so Bun comes
      # from npm at the exact `.bun-version`.
      - name: Install the pinned Bun
        run: |
          bun_version="$(tr -d '\r\n' < .bun-version)"
          [[ "$bun_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global --no-audit --no-fund "bun@$bun_version"
          test "$(bun --version)" = "$bun_version"

      # Only the Server's own tree is needed: the native sources, the node-pty patch pnpm applies on install, and
      # node-addon-api. `--ignore-scripts` skips host-native builds and binary downloads this job never uses.
      - name: Install Server dependencies only
        run: pnpm install --filter @caxri/server --frozen-lockfile --ignore-scripts

      - name: Build manylinux natives
        env:
          LINUX_TARGET: ${{ matrix.target }}
        run: >-
          bun run apps/server/scripts/linux-target.ts export-natives
          --output "${RUNNER_TEMP}/linux-natives" --target "$LINUX_TARGET"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-natives-${{ matrix.target }}
          path: ${{ runner.temp }}/linux-natives
          if-no-files-found: error
          retention-days: 7

  rehearsal:
    name: Hosted macOS no-publish rehearsal
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.android_release_tag == '' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'tjx666' &&
      github.triggering_actor == 'tjx666'
    needs: linux-natives
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CAXRI_E2E_AGENT_MODE: blocked
      CAXRI_RUNNER_AGENT_DISCOVERY: blocked
      PW_TEST_REPORTER: ''
    steps:
      - name: Verify hosted runner boundary before checkout
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify rehearsal event trust boundary
        uses: ./.github/actions/verify-trust-boundary
        with:
          policy-domain: ci
          event-name: ${{ github.event_name }}
          actor: ${{ github.actor }}
          triggering-actor: ${{ github.triggering_actor }}
          event-repository: ${{ github.repository }}
          event-ref: ${{ github.ref }}
          pull-request-author: ${{ github.actor }}
      - uses: ./.github/actions/setup-caxri-job
        with:
          setup-toolchain: 'true'
          install-dependencies: 'true'
          install-electron: 'true'
          install-android-toolchain: 'true'
          gradle-cache: 'true'
      - name: Build Android rehearsal update bundle
        run: |
          keystore="$RUNNER_TEMP/caxri-android-rehearsal.jks"
          password=caxri-rehearsal-only
          trap 'rm -f "$keystore"' EXIT
          keytool -genkeypair -noprompt \
            -alias caxri-rehearsal \
            -dname "CN=Caxri Rehearsal" \
            -keyalg RSA \
            -keypass "$password" \
            -keystore "$keystore" \
            -storepass "$password" \
            -validity 1
          CAXRI_ANDROID_KEYSTORE_PATH="$keystore" \
            CAXRI_ANDROID_KEYSTORE_PASSWORD="$password" \
            CAXRI_ANDROID_KEY_ALIAS=caxri-rehearsal \
            CAXRI_ANDROID_KEY_PASSWORD="$password" \
            bun run --cwd apps/mobile build:update-bundle
      - name: Download Linux natives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-natives-*
          merge-multiple: true
          path: ${{ runner.temp }}/caxri-linux-natives
      - name: Package unsigned Apple Silicon DMGs without publishing
        env:
          CAXRI_LINUX_NATIVES_DIR: ${{ runner.temp }}/caxri-linux-natives
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: bun run package:release-dmgs
      - name: Run targeted packaged smoke
        env:
          # These specs do not request clipboard access on the disposable hosted desktop.
          CAXRI_E2E_CLIPBOARD_PROTECTION: skip-hosted
          CAXRI_BENCHMARK_EXECUTABLE: ${{ github.workspace }}/release.noindex/sourcemap/mac-arm64/Caxri.app/Contents/MacOS/Caxri
          CAXRI_BENCHMARK_PROJECT_ROOT: ${{ github.workspace }}
          CAXRI_PACKAGED_EXECUTABLE: ${{ github.workspace }}/release.noindex/sourcemap/mac-arm64/Caxri.app/Contents/MacOS/Caxri
          CAXRI_E2E_POOL: release-rehearsal
          CAXRI_E2E_RECEIPT_PATH: test-results/receipts/release-rehearsal.json
        run: |
          file "$CAXRI_PACKAGED_EXECUTABLE" | grep -q 'arm64'
          bunx playwright test e2e/startup.performance.e2e.ts e2e/agent-login-path.e2e.ts --reporter=./scripts/reporters/public-e2e-reporter.ts,./scripts/reporters/e2e-receipt-reporter.ts

  android-backfill:
    name: Backfill Android APK for published Release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.android_release_tag != '' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'tjx666' &&
      github.triggering_actor == 'tjx666'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Verify hosted runner boundary before checkout
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify backfill event trust boundary
        uses: ./.github/actions/verify-trust-boundary
        with:
          policy-domain: ci
          event-name: ${{ github.event_name }}
          actor: ${{ github.actor }}
          triggering-actor: ${{ github.triggering_actor }}
          event-repository: ${{ github.repository }}
          event-ref: ${{ github.ref }}
          pull-request-author: ${{ github.actor }}
      - uses: ./.github/actions/setup-caxri-job
        with:
          setup-toolchain: 'true'
      - name: Resolve the existing published release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RELEASE_TAG: ${{ inputs.android_release_tag }}
        run: |
          # Keep this trusted main helper outside the checkout replaced by the pinned release source.
          backfill_root="$RUNNER_TEMP/caxri-android-backfill"
          mkdir -p "$backfill_root/.agents/skills/release/scripts" "$backfill_root/apps/mobile/scripts" "$backfill_root/apps/mobile/plugins"
          cp .agents/skills/release/scripts/android-release-backfill.ts "$backfill_root/.agents/skills/release/scripts/"
          cp apps/mobile/scripts/update-bundle-receipts.ts "$backfill_root/apps/mobile/scripts/"
          cp apps/mobile/plugins/android-release-signing-environment.json "$backfill_root/apps/mobile/plugins/"
          bun run "$backfill_root/.agents/skills/release/scripts/android-release-backfill.ts" resolve "$ANDROID_RELEASE_TAG"
      - name: Checkout the verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-caxri-job
        with:
          setup-toolchain: 'true'
          install-dependencies: 'true'
          install-android-toolchain: 'true'
          gradle-cache: 'true'
      - name: Build the release-signed Android bundle
        id: signed_apk
        env:
          CAXRI_ANDROID_KEYSTORE_BASE64: ${{ secrets.CAXRI_ANDROID_KEYSTORE_BASE64 }}
          CAXRI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CAXRI_ANDROID_KEYSTORE_PASSWORD }}
          CAXRI_ANDROID_KEY_ALIAS: ${{ secrets.CAXRI_ANDROID_KEY_ALIAS }}
          CAXRI_ANDROID_KEY_PASSWORD: ${{ secrets.CAXRI_ANDROID_KEY_PASSWORD }}
          ANDROID_RELEASE_TAG: ${{ inputs.android_release_tag }}
        run: |
          keystore="$RUNNER_TEMP/caxri-android-backfill.jks"
          trap 'rm -f "$keystore"' EXIT
          test -n "$CAXRI_ANDROID_KEYSTORE_BASE64"
          printf '%s' "$CAXRI_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          CAXRI_ANDROID_KEYSTORE_PATH="$keystore" bun run --cwd apps/mobile build:update-bundle
          CAXRI_ANDROID_KEYSTORE_PATH="$keystore" bun run "$RUNNER_TEMP/caxri-android-backfill/.agents/skills/release/scripts/android-release-backfill.ts" verify "$ANDROID_RELEASE_TAG"
      - name: Publish Android assets to the existing Release
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RELEASE_TAG: ${{ inputs.android_release_tag }}
          ANDROID_RELEASE_SHA: ${{ steps.target.outputs.sha }}
          ANDROID_RELEASE_ID: ${{ steps.target.outputs.release_id }}
          ANDROID_VERIFIED_APK_SHA256: ${{ steps.signed_apk.outputs.apk_sha256 }}
        run: >-
          bun run "$RUNNER_TEMP/caxri-android-backfill/.agents/skills/release/scripts/android-release-backfill.ts" publish
          "$ANDROID_RELEASE_TAG" "$ANDROID_RELEASE_SHA" "$ANDROID_RELEASE_ID" "$ANDROID_VERIFIED_APK_SHA256"

  # The Android build is the longest release stage (about 19 minutes cold), so it runs beside linux-natives instead of
  # inside the packaging job. The packaging job downloads its staged bundle and still proves both Desktop flavors carry
  # those exact bytes before publication.
  android-bundle:
    name: Android update bundle
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == 'tjx666' &&
      github.event.workflow_run.triggering_actor.login == 'tjx666' &&
      startsWith(github.event.workflow_run.display_title, 'release: v')
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Verify hosted runner boundary before checkout
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify hosted release boundary
        uses: ./.github/actions/verify-trust-boundary
        with:
          policy-domain: release
          event-name: ${{ github.event.workflow_run.event }}
          actor: ${{ github.event.workflow_run.actor.login }}
          triggering-actor: ${{ github.event.workflow_run.triggering_actor.login }}
          event-repository: ${{ github.event.workflow_run.head_repository.full_name }}
          event-ref: refs/heads/${{ github.event.workflow_run.head_branch }}
          pull-request-author: ${{ github.event.workflow_run.actor.login }}
      - uses: ./.github/actions/setup-caxri-job
        with:
          setup-toolchain: 'true'
          install-dependencies: 'true'
          install-android-toolchain: 'true'
          gradle-cache: 'true'

      # Desktop serves this APK to paired Android phones (docs/mobile/update.md). The script
      # refuses to stage anything but the release-signed APK of this version. The shared setup action
      # installs the Android toolchain explicitly so a missing piece fails the release instead of
      # shipping a Desktop without its phone build.
      - name: Build Android update bundle
        env:
          CAXRI_ANDROID_KEYSTORE_BASE64: ${{ secrets.CAXRI_ANDROID_KEYSTORE_BASE64 }}
          CAXRI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CAXRI_ANDROID_KEYSTORE_PASSWORD }}
          CAXRI_ANDROID_KEY_ALIAS: ${{ secrets.CAXRI_ANDROID_KEY_ALIAS }}
          CAXRI_ANDROID_KEY_PASSWORD: ${{ secrets.CAXRI_ANDROID_KEY_PASSWORD }}
        run: |
          keystore="${RUNNER_TEMP}/caxri-android-release.jks"
          trap 'rm -f "$keystore"' EXIT
          test -n "$CAXRI_ANDROID_KEYSTORE_BASE64"
          printf '%s' "$CAXRI_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          CAXRI_ANDROID_KEYSTORE_PATH="$keystore" bun run --cwd apps/mobile build:update-bundle

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-update-bundle
          path: out/mobile-update
          if-no-files-found: error
          retention-days: 1

  release:
    # PR CI owns the product quality gates. The exact release commit's lightweight CI run rechecks
    # this trusted main-push boundary without repeating platform checks or the macOS E2E suite.
    # GitHub evaluates this condition before checkout; the trust-policy contract binds its literals
    # to .github/ci-trust-policy.json and the shared action rechecks them after checkout.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == 'tjx666' &&
      github.event.workflow_run.triggering_actor.login == 'tjx666' &&
      startsWith(github.event.workflow_run.display_title, 'release: v')
    needs: [linux-natives, android-bundle]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CAXRI_E2E_AGENT_MODE: blocked
      CAXRI_EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
      CAXRI_RUNNER_AGENT_DISCOVERY: blocked
      PW_TEST_REPORTER: ''
    steps:
      - name: Verify hosted runner boundary before checkout
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify hosted release boundary
        uses: ./.github/actions/verify-trust-boundary
        with:
          policy-domain: release
          event-name: ${{ github.event.workflow_run.event }}
          actor: ${{ github.event.workflow_run.actor.login }}
          triggering-actor: ${{ github.event.workflow_run.triggering_actor.login }}
          event-repository: ${{ github.event.workflow_run.head_repository.full_name }}
          event-ref: refs/heads/${{ github.event.workflow_run.head_branch }}
          pull-request-author: ${{ github.event.workflow_run.actor.login }}
      - name: Validate release commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          subject="$(git show -s --format=%s "$RELEASE_COMMIT_SHA")"
          version="$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' package.json | head -1)"
          test -n "$version"
          tag="v${version}"
          expected="release: ${tag}"

          if [[ "$subject" != "$expected" ]]; then
            echo "Expected commit subject '${expected}', received '${subject}'." >&2
            exit 1
          fi
          if response="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>&1)"; then
            echo "Tag '${tag}' already exists." >&2
            exit 1
          elif [[ "$response" != *"HTTP 404"* ]]; then
            echo "$response" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - id: setup
        uses: ./.github/actions/setup-caxri-job
        with:
          setup-toolchain: 'true'
          install-dependencies: 'true'
          install-electron: 'true'

      # actions/checkout's default `clean: true` already runs `git clean -ffdx`, which removes the
      # gitignored release.noindex. Keep the explicit cleanup so neither flavor can reuse an older artifact.
      - name: Clean previous packaging output
        run: rm -rf release.noindex

      # electron-builder copies out/mobile-update into both flavors' Resources/mobile; the packaging step below
      # compares the staged bytes against each app bundle.
      - name: Download Android update bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-update-bundle
          path: out/mobile-update

      - name: Download Linux natives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-natives-*
          merge-multiple: true
          path: ${{ runner.temp }}/caxri-linux-natives

      # Both flavors rebuild Desktop and the embedded Server from the same checkout. The script verifies their isolated
      # app directories, Source Map inventories, Server manifests, DMGs, and checksums before publication.
      - name: Package unsigned Apple Silicon DMGs
        env:
          CAXRI_LINUX_NATIVES_DIR: ${{ runner.temp }}/caxri-linux-natives
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          bun run package:release-dmgs
          for flavor in sourcemap nosourcemap; do
            resources="release.noindex/${flavor}/mac-arm64/Caxri.app/Contents/Resources/mobile"
            cmp out/mobile-update/caxri-mobile.apk "${resources}/caxri-mobile.apk"
            cmp out/mobile-update/manifest.json "${resources}/manifest.json"
            remote="release.noindex/${flavor}/mac-arm64/Caxri.app/Contents/Resources/remote"
            for target in linux-x64 linux-arm64 darwin-arm64; do
              cmp "apps/server/dist/remote/${target}/descriptor.json" "${remote}/${target}/descriptor.json"
              cmp "apps/server/dist/remote/${target}/app.tar.gz" "${remote}/${target}/app.tar.gz"
            done
          done

      - name: Verify packaged application
        id: verify-packaged
        env:
          # Exclude cold Swift/AppKit clipboard preparation from the startup smoke.
          CAXRI_E2E_CLIPBOARD_PROTECTION: skip-hosted
          CAXRI_BENCHMARK_EXECUTABLE: ${{ github.workspace }}/release.noindex/sourcemap/mac-arm64/Caxri.app/Contents/MacOS/Caxri
          CAXRI_BENCHMARK_PROJECT_ROOT: ${{ github.workspace }}
          CAXRI_PACKAGED_EXECUTABLE: ${{ github.workspace }}/release.noindex/sourcemap/mac-arm64/Caxri.app/Contents/MacOS/Caxri
          CAXRI_E2E_POOL: release-packaged
          CAXRI_E2E_RECEIPT_PATH: test-results/receipts/release-packaged.json
        run: |
          file "$CAXRI_BENCHMARK_EXECUTABLE" | grep -q 'arm64'
          bunx playwright test e2e/startup.performance.e2e.ts e2e/agent-login-path.e2e.ts --reporter=./scripts/reporters/public-e2e-reporter.ts,./scripts/reporters/e2e-receipt-reporter.ts

      # The packaged-app probe only runs here. Keep its failure receipt without uploading raw
      # traces, screenshots, or logs from the hosted runner.
      - name: Prepare public E2E receipts
        id: prepare-public-e2e-receipts
        if: always()
        run: bun run scripts/prepare-public-e2e-receipts.ts
      - name: Upload packaged verification failure artifacts
        if: >-
          always() &&
          steps.prepare-public-e2e-receipts.outcome == 'success' &&
          steps.verify-packaged.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-packaged-verification-failure-artifacts
          path: test-results/public-receipts/release-packaged.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify release artifact
        id: artifact
        run: |
          version="$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' package.json | head -1)"
          sourcemap="release.noindex/sourcemap/Caxri-${version}-arm64.dmg"
          nosourcemap="release.noindex/nosourcemap/Caxri-${version}-arm64-nosourcemap.dmg"
          for dmg in "$sourcemap" "$nosourcemap"; do
            test -f "$dmg"
            test -f "${dmg}.sha256"
            hdiutil verify "$dmg"
            (cd "$(dirname "$dmg")" && shasum -a 256 -c "$(basename "$dmg").sha256")
          done

          # Publish the same signed APK that both Desktop flavors carry, rather than rebuilding it.
          android="release.noindex/mobile/Caxri-Mobile-${version}-android-arm64.apk"
          mkdir -p "$(dirname "$android")"
          cp out/mobile-update/caxri-mobile.apk "$android"
          cmp out/mobile-update/caxri-mobile.apk "$android"
          (
            cd "$(dirname "$android")"
            shasum -a 256 "$(basename "$android")" > "$(basename "$android").sha256"
            shasum -a 256 -c "$(basename "$android").sha256"
          )

          {
            echo "sourcemap=${sourcemap}"
            echo "sourcemap_checksum=${sourcemap}.sha256"
            echo "nosourcemap=${nosourcemap}"
            echo "nosourcemap_checksum=${nosourcemap}.sha256"
            echo "android=${android}"
            echo "android_checksum=${android}.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_SOURCEMAP_DMG: ${{ steps.artifact.outputs.sourcemap }}
          RELEASE_SOURCEMAP_CHECKSUM: ${{ steps.artifact.outputs.sourcemap_checksum }}
          RELEASE_NOSOURCEMAP_DMG: ${{ steps.artifact.outputs.nosourcemap }}
          RELEASE_NOSOURCEMAP_CHECKSUM: ${{ steps.artifact.outputs.nosourcemap_checksum }}
          RELEASE_ANDROID_APK: ${{ steps.artifact.outputs.android }}
          RELEASE_ANDROID_CHECKSUM: ${{ steps.artifact.outputs.android_checksum }}
        run: |
          # The DMGs are unsigned/unnotarized: browser downloads get quarantined and Gatekeeper
          # reports the app as "damaged", so the notes lead with the terminal install path.
          android_filename="$(basename "$RELEASE_ANDROID_APK")"
          notes="## Install

          ### macOS (Apple Silicon)

          The DMG is unsigned, so a browser download is quarantined and macOS reports the app as \"damaged\". Install from the terminal instead:

          \`\`\`bash
          bun run install:caxri                  # Source Map build
          bun run install:caxri -- --no-sourcemap # smaller no-map build
          \`\`\`

          Already downloaded with a browser? Clear the quarantine flag once: \`xattr -dr com.apple.quarantine /Applications/Caxri.app\`

          ### Android (arm64)

          1. Download \`${android_filename}\` from **Assets** below on your Android phone.
          2. Open the downloaded APK. If Android asks, enable **Allow from this source** for the browser or file manager, then tap **Install**.
          3. Open Caxri and pair with Desktop from **Settings > Mobile**. Use the same release version on both devices.

          The APK is release-signed and matches the update package bundled with Desktop. Its \`.sha256\` companion verifies download integrity. Later releases can update the app in place without losing pairing data. Switching from a debug-signed development build requires uninstalling that build first, which clears local app data and requires pairing again.

          iOS installation packages are not distributed through GitHub Releases."

          gh release create "$RELEASE_TAG" \
            "$RELEASE_SOURCEMAP_DMG" \
            "$RELEASE_SOURCEMAP_CHECKSUM" \
            "$RELEASE_NOSOURCEMAP_DMG" \
            "$RELEASE_NOSOURCEMAP_CHECKSUM" \
            "$RELEASE_ANDROID_APK" \
            "$RELEASE_ANDROID_CHECKSUM" \
            --target "$RELEASE_TARGET_SHA" \
            --title "Caxri ${RELEASE_TAG}" \
            --notes "$notes" \
            --generate-notes \
            --fail-on-no-commits
