name: Release macOS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Rehearses only `linux-natives` on main without a release commit, so the GitHub-hosted manylinux build and its
  # artifacts are proven before a release depends on them. `release` keeps its `workflow_run` condition and is skipped.
  workflow_dispatch:

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  # SSH Host Servers need node-pty and better-sqlite3 built against glibc 2.28 (ADR 0014). The macOS release runner
  # has no Docker, so each architecture builds natively on a disposable GitHub-hosted Linux runner, running the same
  # manylinux_2_28 container step as a local build (`apps/server/scripts/linux-target.ts`). The job reads no secrets
  # and only uploads the two addons plus their input key; the packaging job refuses them if its own key differs.
  linux-natives:
    name: Linux natives (${{ matrix.target }})
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'tjx666' &&
      github.triggering_actor == 'tjx666') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == 'tjx666' &&
      github.event.workflow_run.triggering_actor.login == 'tjx666' &&
      startsWith(github.event.workflow_run.display_title, 'release: v'))
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - id: tool_versions
        name: Read pnpm and Node.js versions
        run: |
          read_tool_version() {
            sed -nE "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*\"([^\"]+)\"[[:space:]]*$/\1/p" mise.toml
          }
          node_version="$(read_tool_version node)"
          pnpm_version="$(read_tool_version pnpm)"
          [[ "$node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$pnpm_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          echo "node=$node_version" >> "$GITHUB_OUTPUT"
          echo "pnpm=$pnpm_version" >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@c8e77b72cd6022852162c92aa10e7e72b7209c9b # v2
        with:
          version: ${{ steps.tool_versions.outputs.pnpm }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.tool_versions.outputs.node }}
          package-manager-cache: false

      # The Actions allowlist admits only GitHub-owned actions and `pnpm/setup` (see guards.yml), so Bun comes
      # from npm at the exact `.bun-version`.
      - name: Install the pinned Bun
        run: |
          bun_version="$(tr -d '\r\n' < .bun-version)"
          [[ "$bun_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global --no-audit --no-fund "bun@$bun_version"
          test "$(bun --version)" = "$bun_version"

      # Only the Server's own tree is needed: the native sources, the node-pty patch pnpm applies on install, and
      # node-addon-api. `--ignore-scripts` skips host-native builds and binary downloads this job never uses.
      - name: Install Server dependencies only
        run: pnpm install --filter @caxri/server --frozen-lockfile --ignore-scripts

      - name: Build manylinux natives
        env:
          LINUX_TARGET: ${{ matrix.target }}
        run: >-
          bun run apps/server/scripts/linux-target.ts export-natives
          --output "${RUNNER_TEMP}/linux-natives" --target "$LINUX_TARGET"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-natives-${{ matrix.target }}
          path: ${{ runner.temp }}/linux-natives
          if-no-files-found: error
          retention-days: 7

  release:
    # PR CI owns the product quality gates. The exact release commit's lightweight CI run rechecks
    # this trusted main-push boundary without repeating platform checks or the macOS E2E suite.
    # GitHub evaluates this condition before checkout; the trust-policy contract binds its literals
    # to .github/ci-trust-policy.json and the shared action rechecks them after checkout.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == 'tjx666' &&
      github.event.workflow_run.triggering_actor.login == 'tjx666' &&
      startsWith(github.event.workflow_run.display_title, 'release: v')
    needs: linux-natives
    runs-on: [self-hosted, macOS, ARM64, caxri-release]
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CAXRI_DESKTOP_LEASE_OWNER: caxri-${{ github.run_id }}-${{ github.run_attempt }}-release
      CAXRI_E2E_AGENT_MODE: blocked
      CAXRI_EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
      CAXRI_RUNNER_AGENT_DISCOVERY: blocked
      CAXRI_RUNNER_OWNER: caxri-${{ github.run_id }}-${{ github.run_attempt }}-release
    steps:
      - name: Verify runner boundary before checkout
        run: |
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify self-hosted release boundary
        uses: ./.github/actions/verify-trust-boundary
        with:
          policy-domain: release
          event-name: ${{ github.event.workflow_run.event }}
          actor: ${{ github.event.workflow_run.actor.login }}
          triggering-actor: ${{ github.event.workflow_run.triggering_actor.login }}
          event-repository: ${{ github.event.workflow_run.head_repository.full_name }}
          event-ref: refs/heads/${{ github.event.workflow_run.head_branch }}
          pull-request-author: ${{ github.event.workflow_run.actor.login }}
      - name: Validate release commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          subject="$(git show -s --format=%s "$RELEASE_COMMIT_SHA")"
          version="$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' package.json | head -1)"
          test -n "$version"
          tag="v${version}"
          expected="release: ${tag}"

          if [[ "$subject" != "$expected" ]]; then
            echo "Expected commit subject '${expected}', received '${subject}'." >&2
            exit 1
          fi
          if response="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>&1)"; then
            echo "Tag '${tag}' already exists." >&2
            exit 1
          elif [[ "$response" != *"HTTP 404"* ]]; then
            echo "$response" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - id: setup
        uses: ./.github/actions/setup-caxri-job
        with:
          setup-toolchain: 'true'
          install-dependencies: 'true'
          install-electron: 'true'

      # actions/checkout's default `clean: true` already runs `git clean -ffdx`, which removes the
      # gitignored release.noindex, so a DMG from an earlier build on this self-hosted runner should
      # never reach the packaging step. This makes the single-DMG precondition explicit next to the
      # code that depends on it rather than relying on that default staying in place.
      - name: Clean previous packaging output
        run: rm -rf release.noindex

      # Desktop serves this APK to paired Android phones (docs/mobile/update.md). The script
      # refuses to stage anything but the release-signed APK of this version, and the runner must
      # already hold the Android toolchain: a missing piece fails the release instead of shipping a
      # Desktop without its phone build.
      - name: Build Android update bundle
        env:
          CAXRI_ANDROID_KEYSTORE_BASE64: ${{ secrets.CAXRI_ANDROID_KEYSTORE_BASE64 }}
          CAXRI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CAXRI_ANDROID_KEYSTORE_PASSWORD }}
          CAXRI_ANDROID_KEY_ALIAS: ${{ secrets.CAXRI_ANDROID_KEY_ALIAS }}
          CAXRI_ANDROID_KEY_PASSWORD: ${{ secrets.CAXRI_ANDROID_KEY_PASSWORD }}
        run: |
          keystore="${RUNNER_TEMP}/caxri-android-release.jks"
          trap 'rm -f "$keystore"' EXIT
          test -n "$CAXRI_ANDROID_KEYSTORE_BASE64"
          printf '%s' "$CAXRI_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          CAXRI_ANDROID_KEYSTORE_PATH="$keystore" bun run --cwd apps/mobile build:update-bundle

      - name: Download Linux natives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-natives-*
          merge-multiple: true
          path: ${{ runner.temp }}/caxri-linux-natives

      # `package:dmg` builds the SSH Host upload layers (`build:remote-layers`) from the natives the Linux jobs
      # exported; a missing or stale export fails the build instead of reaching for Docker on this runner.
      - name: Package unsigned Apple Silicon DMG
        env:
          CAXRI_LINUX_NATIVES_DIR: ${{ runner.temp }}/caxri-linux-natives
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          bun run package:dmg -- --arm64
          resources="release.noindex/mac-arm64/Caxri.app/Contents/Resources/mobile"
          cmp out/mobile-update/caxri-mobile.apk "${resources}/caxri-mobile.apk"
          cmp out/mobile-update/manifest.json "${resources}/manifest.json"
          remote="release.noindex/mac-arm64/Caxri.app/Contents/Resources/remote"
          for target in linux-x64 linux-arm64; do
            cmp "apps/server/dist/remote/${target}/descriptor.json" "${remote}/${target}/descriptor.json"
            cmp "apps/server/dist/remote/${target}/app.tar.gz" "${remote}/${target}/app.tar.gz"
          done

      - name: Verify packaged application
        id: verify-packaged
        env:
          CAXRI_BENCHMARK_EXECUTABLE: ${{ github.workspace }}/release.noindex/mac-arm64/Caxri.app/Contents/MacOS/Caxri
          CAXRI_BENCHMARK_PROJECT_ROOT: ${{ github.workspace }}
          CAXRI_PACKAGED_EXECUTABLE: ${{ github.workspace }}/release.noindex/mac-arm64/Caxri.app/Contents/MacOS/Caxri
          CAXRI_E2E_POOL: release-packaged
          CAXRI_E2E_RECEIPT_PATH: test-results/receipts/release-packaged.json
        run: |
          file "$CAXRI_BENCHMARK_EXECUTABLE" | grep -q 'arm64'
          bunx playwright test e2e/startup.performance.e2e.ts e2e/agent-login-path.e2e.ts --reporter=line,./scripts/reporters/e2e-receipt-reporter.ts

      # The packaged-app probe only runs here. Keep its failure receipt without uploading raw
      # traces, screenshots, or logs from the self-hosted runner.
      - name: Upload packaged verification failure artifacts
        if: always() && steps.verify-packaged.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-packaged-verification-failure-artifacts
          path: test-results/receipts/release-packaged.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify release artifact
        id: artifact
        run: |
          # Publication needs exactly one DMG. "First match" would silently pick a stale build.
          dmgs=()
          while IFS= read -r -d '' path; do dmgs+=("$path"); done \
            < <(find release.noindex -maxdepth 1 -type f -name '*.dmg' -print0 | sort -z)
          if [[ ${#dmgs[@]} -eq 0 ]]; then
            echo "No DMG was produced." >&2
            exit 1
          fi
          if [[ ${#dmgs[@]} -gt 1 ]]; then
            echo "Expected exactly one DMG in release.noindex, found ${#dmgs[@]}:" >&2
            printf '  %s\n' "${dmgs[@]}" >&2
            exit 1
          fi
          dmg="${dmgs[0]}"

          hdiutil verify "$dmg"
          dmg_directory="$(dirname "$dmg")"
          dmg_name="$(basename "$dmg")"
          (cd "$dmg_directory" && shasum -a 256 "$dmg_name" > "${dmg_name}.sha256")

          echo "dmg=${dmg}" >> "$GITHUB_OUTPUT"
          echo "checksum=${dmg}.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_DMG: ${{ steps.artifact.outputs.dmg }}
          RELEASE_CHECKSUM: ${{ steps.artifact.outputs.checksum }}
        run: |
          # The DMG is unsigned/unnotarized: browser downloads get quarantined and Gatekeeper
          # reports the app as "damaged", so the notes lead with the terminal install path.
          notes="## Install

          The DMG is unsigned, so a browser download is quarantined and macOS reports the app as \"damaged\". Install from the terminal instead:

          \`\`\`bash
          bun run install:caxri            # from a Caxri checkout (downloads, verifies, installs)
          \`\`\`

          Already downloaded with a browser? Clear the quarantine flag once: \`xattr -dr com.apple.quarantine /Applications/Caxri.app\`"

          gh release create "$RELEASE_TAG" \
            "$RELEASE_DMG" \
            "$RELEASE_CHECKSUM" \
            --target "$RELEASE_TARGET_SHA" \
            --title "Caxri ${RELEASE_TAG}" \
            --notes "$notes" \
            --generate-notes \
            --fail-on-no-commits
      - name: Clean self-hosted runner boundary
        if: always()
        run: bun run scripts/self-hosted-runner.ts cleanup
