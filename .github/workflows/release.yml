name: Release macOS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    # CI already owns every quality gate and the full macOS E2E suite. Wait for that workflow so
    # release commits consume one E2E runner instead of executing the same suite twice.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == 'tjx666' &&
      github.event.workflow_run.triggering_actor.login == 'tjx666' &&
      startsWith(github.event.workflow_run.display_title, 'release: v')
    runs-on: [self-hosted, macOS, ARM64, caxri-release]
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CAXRI_DESKTOP_LEASE_OWNER: caxri-${{ github.run_id }}-${{ github.run_attempt }}-release
      CAXRI_E2E_AGENT_MODE: blocked
      CAXRI_EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
      CAXRI_RUNNER_AGENT_DISCOVERY: blocked
      CAXRI_RUNNER_OWNER: caxri-${{ github.run_id }}-${{ github.run_attempt }}-release
    steps:
      - name: Verify self-hosted release boundary
        env:
          RELEASE_ACTOR: ${{ github.event.workflow_run.actor.login }}
          RELEASE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RELEASE_TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: |
          test "$RELEASE_ACTOR" = tjx666
          test "$RELEASE_TRIGGERING_ACTOR" = tjx666
          test "$RELEASE_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
      - id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-caxri-job
        with:
          setup-node: 'true'

      - name: Validate release commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          subject="$(git show -s --format=%s "$RELEASE_COMMIT_SHA")"
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          expected="release: ${tag}"

          if [[ "$subject" != "$expected" ]]; then
            echo "Expected commit subject '${expected}', received '${subject}'." >&2
            exit 1
          fi
          if response="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>&1)"; then
            echo "Tag '${tag}' already exists." >&2
            exit 1
          elif [[ "$response" != *"HTTP 404"* ]]; then
            echo "$response" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Package unsigned Apple Silicon DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: bun run package:dmg -- --arm64

      - name: Verify packaged application
        env:
          CAXRI_BENCHMARK_EXECUTABLE: ${{ github.workspace }}/release/mac-arm64/Caxri.app/Contents/MacOS/Caxri
          CAXRI_BENCHMARK_PROJECT_ROOT: ${{ github.workspace }}
          CAXRI_PACKAGED_EXECUTABLE: ${{ github.workspace }}/release/mac-arm64/Caxri.app/Contents/MacOS/Caxri
        run: |
          file "$CAXRI_BENCHMARK_EXECUTABLE" | grep -q 'arm64'
          bunx playwright test e2e/startup.performance.e2e.ts e2e/agent-login-path.e2e.ts --reporter=line

      - name: Verify release artifact
        id: artifact
        run: |
          dmg="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "No DMG was produced." >&2
            exit 1
          fi

          hdiutil verify "$dmg"
          dmg_directory="$(dirname "$dmg")"
          dmg_name="$(basename "$dmg")"
          (cd "$dmg_directory" && shasum -a 256 "$dmg_name" > "${dmg_name}.sha256")

          echo "dmg=${dmg}" >> "$GITHUB_OUTPUT"
          echo "checksum=${dmg}.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_DMG: ${{ steps.artifact.outputs.dmg }}
          RELEASE_CHECKSUM: ${{ steps.artifact.outputs.checksum }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RELEASE_DMG" \
            "$RELEASE_CHECKSUM" \
            --target "$RELEASE_TARGET_SHA" \
            --title "Caxri ${RELEASE_TAG}" \
            --generate-notes \
            --fail-on-no-commits
      - name: Clean self-hosted runner boundary
        if: always()
        run: bun run scripts/self-hosted-runner.ts cleanup
