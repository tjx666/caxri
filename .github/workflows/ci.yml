name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
  workflow_dispatch:
    inputs:
      e2e_profile:
        description: Full-suite profile for self-hosted control or optimized A/B runs
        required: true
        default: skip
        type: choice
        options: [skip, control, optimized]
      eslint_concurrency:
        description: ESLint concurrency for self-hosted A/B runs
        required: true
        default: 'off'
        type: choice
        options: ['off', '2', auto]
      vitest_partition:
        description: Vitest serial partition for self-hosted A/B runs
        required: true
        default: optimized
        type: choice
        options: [legacy, optimized]
      vitest_max_workers:
        description: Vitest worker cap for self-hosted A/B runs
        required: true
        default: '2'
        type: choice
        options: ['1', '2', '3', '4']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  retry-policy:
    name: >-
      ${{ github.event_name == 'pull_request'
        && format('retry-policy / pr-{0} / base-{1}', github.event.pull_request.number, github.event.pull_request.base.sha)
        || format('retry-policy / {0}', github.ref_name) }}
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.actor == 'tjx666' &&
        github.triggering_actor == 'tjx666' &&
        github.event.pull_request.user.login == 'tjx666' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'workflow_dispatch' &&
        github.actor == 'tjx666' &&
        github.triggering_actor == 'tjx666'
      ) || (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'tjx666' &&
        github.triggering_actor == 'tjx666'
      )
    runs-on: [self-hosted, macOS, ARM64, caxri-ci]
    env:
      CAXRI_DESKTOP_LEASE_OWNER: caxri-${{ github.run_id }}-${{ github.run_attempt }}-retry-policy
      CAXRI_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CAXRI_RUNNER_AGENT_DISCOVERY: blocked
      CAXRI_RUNNER_OWNER: caxri-${{ github.run_id }}-${{ github.run_attempt }}-retry-policy
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      reason: ${{ steps.policy.outputs.reason }}
      base_run: ${{ steps.policy.outputs.base_run }}
      validated_tree: ${{ steps.policy.outputs.validated_tree }}
      e2e_tests: ${{ steps.policy.outputs.e2e_tests }}
      e2e_pool: ${{ steps.policy.outputs.e2e_pool }}
      checks_scope: ${{ steps.policy.outputs.checks_scope }}
      run_e2e: ${{ steps.policy.outputs.run_e2e }}
      e2e_profile: ${{ steps.policy.outputs.e2e_profile }}
      changed_files: ${{ steps.policy.outputs.changed_files }}
      reused_e2e_run: ${{ steps.policy.outputs.reused_e2e_run }}
      reused_e2e_head: ${{ steps.policy.outputs.reused_e2e_head }}
    steps:
      - id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # PR workflows otherwise check out GitHub's synthetic merge commit, which cannot carry
          # the immutable retry trailers or exact validated tree from the pushed head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-caxri-job
      - id: policy
        name: Resolve exact-tree retry and execution policy
        run: bun run scripts/ci-retry-policy.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Clean self-hosted runner boundary
        if: always()
        run: bun run scripts/self-hosted-runner.ts cleanup

  checks:
    needs: retry-policy
    if: >-
      needs.retry-policy.outputs.mode == 'full' &&
      needs.retry-policy.outputs.checks_scope != 'skipped'
    runs-on: [self-hosted, macOS, ARM64, caxri-ci]
    env:
      CAXRI_DESKTOP_LEASE_OWNER: caxri-${{ github.run_id }}-${{ github.run_attempt }}-checks
      CAXRI_EXPECTED_HEAD: ${{ github.sha }}
      CAXRI_RUNNER_AGENT_DISCOVERY: blocked
      CAXRI_RUNNER_OWNER: caxri-${{ github.run_id }}-${{ github.run_attempt }}-checks
    steps:
      - id: checkout
        uses: actions/checkout@v7
        with:
          # React Doctor reports only issues new relative to the push/PR base; a shallow
          # checkout breaks that base detection and it falls back to reporting every
          # existing issue (https://www.react.doctor/docs/ci-and-prs/github-actions-setup).
          fetch-depth: 0
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-caxri-job
        with:
          setup-toolchain: 'true'
          install-dependencies: 'true'
          install-electron: ${{ needs.retry-policy.outputs.checks_scope == 'full' || needs.retry-policy.outputs.checks_scope == 'focused-source' }}
          rebuild-native: ${{ needs.retry-policy.outputs.checks_scope == 'full' || needs.retry-policy.outputs.checks_scope == 'focused-source' }}
      - name: Run focused changed-file checks
        if: needs.retry-policy.outputs.checks_scope != 'full'
        env:
          CI_CHANGED_FILES: ${{ needs.retry-policy.outputs.changed_files }}
          CI_CHECKS_SCOPE: ${{ needs.retry-policy.outputs.checks_scope }}
        run: bun run scripts/run-ci-focused-checks.ts
      - name: Run ESLint
        if: needs.retry-policy.outputs.checks_scope == 'full'
        env:
          ESLINT_CONCURRENCY: ${{ inputs.eslint_concurrency || 'off' }}
        run: bun run scripts/ci-metrics.ts --label "ESLint concurrency=${ESLINT_CONCURRENCY}" -- bun run lint --concurrency "$ESLINT_CONCURRENCY"
      - name: Run markdownlint
        if: needs.retry-policy.outputs.checks_scope == 'full'
        run: bun run lint:markdown
      - if: needs.retry-policy.outputs.checks_scope == 'full'
        run: bun run knip
      - if: needs.retry-policy.outputs.checks_scope == 'full'
        run: bun run doctor:changed
        env:
          CAXRI_REACT_DOCTOR_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - if: needs.retry-policy.outputs.checks_scope == 'full'
        run: bun run typecheck
      - if: needs.retry-policy.outputs.checks_scope == 'full'
        run: bun run format:check
      - name: Run unit and integration tests
        if: needs.retry-policy.outputs.checks_scope == 'full'
        env:
          CAXRI_VITEST_MAX_WORKERS: ${{ inputs.vitest_max_workers || '2' }}
          CAXRI_VITEST_PARTITION: ${{ inputs.vitest_partition || 'optimized' }}
        run: >-
          bun run scripts/ci-metrics.ts
          --label "Vitest full suite partition=${CAXRI_VITEST_PARTITION} workers=${CAXRI_VITEST_MAX_WORKERS}" --
          bun run test
      - name: Build Electron bundles
        if: needs.retry-policy.outputs.checks_scope == 'full'
        run: bun run scripts/ci-metrics.ts --label "Electron Vite build" -- bun run build
      - name: Clean self-hosted runner boundary
        if: always()
        run: bun run scripts/self-hosted-runner.ts cleanup

  e2e:
    name: e2e
    needs: [retry-policy, checks]
    if: >-
      always() &&
      needs.retry-policy.result == 'success' &&
      needs.retry-policy.outputs.run_e2e == 'true' &&
      (
        (needs.retry-policy.outputs.mode == 'full' && needs.checks.result == 'success') ||
        (
          (needs.retry-policy.outputs.mode == 'e2e-only' || needs.retry-policy.outputs.mode == 'e2e-repair') &&
          needs.checks.result == 'skipped'
        )
      ) &&
      (
        (
          github.event_name == 'pull_request' &&
          github.actor == 'tjx666' &&
          github.triggering_actor == 'tjx666' &&
          github.event.pull_request.user.login == 'tjx666' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) || (
          github.event_name == 'workflow_dispatch' &&
          github.actor == 'tjx666' &&
          github.triggering_actor == 'tjx666'
        ) || (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.actor == 'tjx666' &&
          github.triggering_actor == 'tjx666' &&
          startsWith(github.event.head_commit.message, 'release: v')
        )
      )
    runs-on: [self-hosted, macOS, ARM64, caxri-e2e]
    env:
      CAXRI_DESKTOP_LEASE_OWNER: caxri-${{ github.run_id }}-${{ github.run_attempt }}-e2e
      CAXRI_E2E_AGENT_MODE: blocked
      CAXRI_E2E_RUNNER_KIND: self-hosted
      CAXRI_E2E_RUNNER_REASON: >-
        ${{ github.event_name == 'pull_request'
          && 'trusted same-repository tjx666 PR head'
          || github.event_name == 'workflow_dispatch'
          && 'trusted tjx666 validation dispatch'
          || github.event_name == 'push'
          && 'trusted tjx666 release commit'
          || 'unreachable untrusted event' }}
      CAXRI_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CAXRI_RUNNER_AGENT_DISCOVERY: blocked
      CAXRI_RUNNER_OWNER: caxri-${{ github.run_id }}-${{ github.run_attempt }}-e2e
    steps:
      - name: Verify self-hosted trust boundary
        env:
          EVENT_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          test "$GITHUB_ACTOR" = tjx666
          test "$TRIGGERING_ACTOR" = tjx666
          test "$EVENT_REPOSITORY" = "$GITHUB_REPOSITORY"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            test "$PR_AUTHOR" = tjx666
          elif [[ "$EVENT_NAME" == push ]]; then
            test "$GITHUB_REF" = refs/heads/main
            [[ "$EVENT_HEAD_MESSAGE" == "release: v"* ]]
          else
            test "$EVENT_NAME" = workflow_dispatch
          fi
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
      - id: checkout
        uses: actions/checkout@v7
        with:
          # PR E2E must execute the same exact pushed head whose immutable receipt and tree were
          # validated by retry-policy. The PR base identity is checked separately by that policy.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-caxri-job
        with:
          setup-toolchain: 'true'
          install-dependencies: 'true'
          install-electron: 'true'
          rebuild-native: 'true'
      - name: Report E2E runner route
        run: |
          {
            echo "## E2E runner route"
            echo
            echo "| Runner | Kind | Reason | Exact head |"
            echo "| --- | --- | --- | --- |"
            echo "| \`$RUNNER_NAME\` | \`$CAXRI_E2E_RUNNER_KIND\` | $CAXRI_E2E_RUNNER_REASON | \`$CAXRI_EXPECTED_HEAD\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record validation environment
        env:
          E2E_PROFILE: ${{ needs.retry-policy.outputs.e2e_profile }}
          RUNNER_LABELS: self-hosted,macOS,ARM64,caxri-e2e
          VITEST_MAX_WORKERS: ${{ inputs.vitest_max_workers || '2' }}
          VITEST_PARTITION: ${{ inputs.vitest_partition || 'optimized' }}
        run: |
          NODE_VERSION="$(node --version)" \
            PNPM_VERSION="$(pnpm --version)" \
            LOCKFILE_SHA256="$(shasum -a 256 pnpm-lock.yaml | awk '{print $1}')" \
            bun -e 'console.log(`CAXRI_VALIDATION_ENV ${JSON.stringify({ bun: Bun.version, e2eProfile: process.env.E2E_PROFILE, exactHead: process.env.CAXRI_EXPECTED_HEAD, lockfileSha256: process.env.LOCKFILE_SHA256, node: process.env.NODE_VERSION, pnpm: process.env.PNPM_VERSION, runnerLabels: process.env.RUNNER_LABELS?.split(","), runnerName: process.env.RUNNER_NAME, vitestMaxWorkers: process.env.VITEST_MAX_WORKERS, vitestPartition: process.env.VITEST_PARTITION })}`)'
      - name: Verify Electron native modules
        run: bun run scripts/ci-metrics.ts --label "Electron native compatibility" -- bun run spike:native
      - name: Build Electron bundles
        id: e2e-build
        run: bun run scripts/ci-metrics.ts --label "Electron Vite build" -- bun run build
      - name: Run focused repair specs
        id: focused-repair
        if: always() && steps.e2e-build.outcome == 'success' && needs.retry-policy.outputs.mode == 'e2e-repair'
        env:
          CI_E2E_POOL: ${{ needs.retry-policy.outputs.e2e_pool }}
          CI_E2E_TESTS: ${{ needs.retry-policy.outputs.e2e_tests }}
        run: bun run scripts/run-e2e-repair.ts
      - name: Run one-worker control suite
        id: control
        if: always() && steps.e2e-build.outcome == 'success' && needs.retry-policy.outputs.e2e_profile == 'control'
        run: >-
          bun run scripts/ci-metrics.ts --label "Playwright control workers=1" --
          bun run scripts/run-e2e-pools.ts --pool control
      - name: Prove desktop worker interruption recovery
        id: failure-isolation
        if: always() && steps.e2e-build.outcome == 'success' && needs.retry-policy.outputs.e2e_profile == 'optimized'
        run: >-
          bun run scripts/ci-metrics.ts --label "Desktop worker interruption recovery" --
          bun run scripts/run-e2e-failure-isolation.ts
      - name: Prove bounded E2E failure census
        id: failure-census
        if: always() && steps.e2e-build.outcome == 'success'
        run: bun run scripts/run-e2e-census-fixture.ts
      - name: Run parallel-safe pool
        id: parallel-safe
        if: always() && steps.e2e-build.outcome == 'success' && needs.retry-policy.outputs.e2e_profile == 'optimized'
        run: >-
          bun run scripts/ci-metrics.ts --label "Playwright parallel-safe workers=2" --
          bun run scripts/run-e2e-pools.ts --pool parallel-safe
      - name: Run desktop-exclusive pool
        id: desktop-exclusive
        if: always() && steps.e2e-build.outcome == 'success' && needs.retry-policy.outputs.e2e_profile == 'optimized'
        run: >-
          bun run scripts/ci-metrics.ts --label "Playwright desktop-exclusive workers=1" --
          bun run scripts/run-e2e-pools.ts --pool desktop-exclusive
      - name: Run deterministic CI-parity cases
        id: ci-parity
        if: always() && steps.e2e-build.outcome == 'success' && github.event_name == 'workflow_dispatch'
        run: bun run scripts/ci-metrics.ts --label "CI parity workers=1 repeat=3" -- bun run scripts/run-ci-parity.ts
      - name: Record actual E2E execution receipt
        id: execution-receipt
        if: always() && steps.e2e-build.outcome == 'success'
        run: >-
          bun run scripts/report-e2e-manifest.ts
          ${{ needs.retry-policy.outputs.e2e_profile == 'optimized' && 'parallel-safe desktop-exclusive' || 'control' }}
      - name: Upload parallel-safe failure artifacts
        if: always() && steps.parallel-safe.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-parallel-safe-failure-artifacts
          path: |
            test-results/parallel-safe/
            test-results/receipts/parallel-safe.json
            logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload desktop-exclusive failure artifacts
        if: always() && steps.desktop-exclusive.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-desktop-exclusive-failure-artifacts
          path: |
            test-results/desktop-exclusive/
            test-results/receipts/desktop-exclusive.json
            logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload control failure artifacts
        if: always() && steps.control.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-control-failure-artifacts
          path: |
            test-results/control/
            test-results/receipts/control.json
            logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload auxiliary E2E failure artifacts
        if: >-
          always() && (
            steps.focused-repair.outcome == 'failure' ||
            steps.failure-isolation.outcome == 'failure' ||
            steps.failure-census.outcome == 'failure' ||
            steps.ci-parity.outcome == 'failure' ||
            steps.execution-receipt.outcome == 'failure'
          )
        uses: actions/upload-artifact@v7
        with:
          name: e2e-auxiliary-failure-artifacts
          path: |
            test-results/
            logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean self-hosted runner boundary
        if: always()
        run: bun run scripts/self-hosted-runner.ts cleanup

  ci:
    name: CI gate
    if: always()
    needs: [retry-policy, checks, e2e]
    runs-on: [self-hosted, macOS, ARM64, caxri-ci]
    steps:
      - name: Verify required execution path
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          CHECKS_SCOPE: ${{ needs.retry-policy.outputs.checks_scope }}
          E2E_RESULT: ${{ needs.e2e.result }}
          MODE: ${{ needs.retry-policy.outputs.mode }}
          RETRY_POLICY_RESULT: ${{ needs.retry-policy.result }}
          SHOULD_RUN_E2E: ${{ needs.retry-policy.outputs.run_e2e }}
          TRUSTED_EVENT: >-
            ${{ (
              github.event_name == 'pull_request' &&
              github.actor == 'tjx666' &&
              github.triggering_actor == 'tjx666' &&
              github.event.pull_request.user.login == 'tjx666' &&
              github.event.pull_request.head.repo.full_name == github.repository
            ) || (
              github.event_name == 'workflow_dispatch' &&
              github.actor == 'tjx666' &&
              github.triggering_actor == 'tjx666'
            ) || (
              github.event_name == 'push' &&
              github.ref == 'refs/heads/main' &&
              github.actor == 'tjx666' &&
              github.triggering_actor == 'tjx666'
            ) }}
        run: |
          test "$TRUSTED_EVENT" = true
          test "$RETRY_POLICY_RESULT" = success
          if test "$MODE" = full; then
            if test "$CHECKS_SCOPE" = skipped; then
              test "$CHECKS_RESULT" = skipped
            else
              test "$CHECKS_SCOPE" = full || test "$CHECKS_SCOPE" = focused-docs || test "$CHECKS_SCOPE" = focused-skills || test "$CHECKS_SCOPE" = focused-source
              test "$CHECKS_RESULT" = success
            fi
          else
            test "$MODE" = e2e-only || test "$MODE" = e2e-repair
            test "$CHECKS_SCOPE" = skipped
            test "$CHECKS_RESULT" = skipped
          fi
          if test "$SHOULD_RUN_E2E" = true; then
            test "$E2E_RESULT" = success
          else
            test "$E2E_RESULT" = skipped
          fi
