name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # React Doctor reports only issues new relative to the push/PR base; a shallow
          # checkout breaks that base detection and it falls back to reporting every
          # existing issue (https://www.react.doctor/docs/ci-and-prs/github-actions-setup).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: bun run lint
      - run: bun run knip
      - run: bun run doctor
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run format:md:check
      - run: bun run test
      - run: bun run build

  e2e:
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: bun run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            logs/
          if-no-files-found: ignore
