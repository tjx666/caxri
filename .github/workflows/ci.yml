name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review]
  workflow_dispatch:
    inputs:
      validation_target:
        description: Explicit validation route; full E2E never runs automatically
        required: true
        default: checks-only
        type: choice
        options: [checks-only, hosted-smoke, hosted-full]
      e2e_profile:
        description: Full-suite profile for an explicitly selected full E2E route
        required: true
        default: skip
        type: choice
        options: [skip, control, optimized]
      eslint_concurrency:
        description: ESLint concurrency for an explicit full validation
        required: true
        default: 'off'
        type: choice
        options: ['off', '2', auto]
      vitest_partition:
        description: Vitest partition for an explicit full validation
        required: true
        default: optimized
        type: choice
        options: [legacy, optimized]
      vitest_max_workers:
        description: Vitest worker cap for an explicit full validation
        required: true
        # One worker stretches an explicit full validation into the parallel-safe pool and past the
        # concurrent-validation deadline (issue #1842).
        default: '2'
        type: choice
        options: ['1', '2', '3', '4']
      e2e_parallel_workers:
        description: Parallel-safe Playwright worker cap for an explicit full validation
        required: true
        default: '3'
        type: choice
        options: ['2', '3', '4']

concurrency:
  group: >-
    ci-${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: v'))
        && format('release-{0}', github.sha)
      || github.event_name == 'workflow_dispatch'
        && format('dispatch-{0}', github.run_id)
      || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  retry-policy:
    name: >-
      ${{ github.event_name == 'pull_request'
        && format('retry-policy / pr-{0} / base-{1}', github.event.pull_request.number, github.event.pull_request.base.sha)
        || format('retry-policy / {0}', github.ref_name) }}
    if: >-
      (
        github.event_name == 'pull_request'
      ) || (
        github.event_name == 'workflow_dispatch' &&
        github.actor == 'tjx666' &&
        github.triggering_actor == 'tjx666'
      ) || (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      )
    # The policy only reads Git history and the Actions API, so it does not hold one of the account's scarce
    # concurrent macOS runners while the checks and unit jobs queue behind it.
    runs-on: ubuntu-latest
    env:
      CAXRI_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CAXRI_RUNNER_AGENT_DISCOVERY: blocked
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      reason: ${{ steps.policy.outputs.reason }}
      base_run: ${{ steps.policy.outputs.base_run }}
      retry_kind: ${{ steps.policy.outputs.retry_kind }}
      e2e_tests: ${{ steps.policy.outputs.e2e_tests }}
      e2e_pool: ${{ steps.policy.outputs.e2e_pool }}
      checks_scope: ${{ steps.policy.outputs.checks_scope }}
      run_e2e: ${{ steps.policy.outputs.run_e2e }}
      e2e_profile: ${{ steps.policy.outputs.e2e_profile }}
      changed_files: ${{ steps.policy.outputs.changed_files }}
      reused_e2e_run: ${{ steps.policy.outputs.reused_e2e_run }}
      reused_e2e_head: ${{ steps.policy.outputs.reused_e2e_head }}
    steps:
      - name: Verify hosted runner boundary before checkout
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # PR workflows otherwise check out GitHub's synthetic merge commit, which cannot carry
          # the immutable retry trailers or exact validated tree from the pushed head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify read-only event trust boundary
        uses: ./.github/actions/verify-trust-boundary
        with:
          policy-domain: ci
          event-name: ${{ github.event_name }}
          actor: ${{ github.actor }}
          triggering-actor: ${{ github.triggering_actor }}
          event-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          event-ref: ${{ github.ref }}
          pull-request-author: ${{ github.event.pull_request.user.login || github.actor }}
          allow-external-pull-request: 'true'
      - id: setup
        uses: ./.github/actions/setup-caxri-job
        with:
          setup-toolchain: 'true'
      - id: policy
        name: Resolve exact-tree retry and execution policy
        run: bun run scripts/ci-retry-policy.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
  checks:
    needs: retry-policy
    if: >-
      needs.retry-policy.outputs.checks_scope != 'skipped' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.validation_target != 'hosted-full' ||
        needs.retry-policy.outputs.checks_scope != 'full' ||
        needs.retry-policy.outputs.e2e_profile != 'optimized'
      )
    # Every full-scope gate left here is platform-neutral (Vitest, ESLint, and the bundle budget run in their own jobs), so the full scope
    # uses a Linux runner and leaves the account's macOS concurrency to the unit shards. The focused scopes may run
    # tests that load native modules, so they stay on macOS.
    runs-on: ${{ needs.retry-policy.outputs.checks_scope == 'full' && 'ubuntu-latest' || 'macos-15' }}
    env:
      CAXRI_EXPECTED_HEAD: ${{ github.sha }}
      CAXRI_RUNNER_AGENT_DISCOVERY: blocked
    steps:
      - name: Verify hosted runner boundary before checkout
        env:
          CHECKS_SCOPE: ${{ needs.retry-policy.outputs.checks_scope }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          if test "$CHECKS_SCOPE" = full; then
            test "$RUNNER_OS" = Linux
            test "$RUNNER_ARCH" = X64
          else
            test "$RUNNER_OS" = macOS
            test "$RUNNER_ARCH" = ARM64
          fi
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # React Doctor reports only issues new relative to the push/PR base; a shallow
          # checkout breaks that base detection and it falls back to reporting every
          # existing issue (https://www.react.doctor/docs/ci-and-prs/github-actions-setup).
          fetch-depth: 0
          persist-credentials: false
      - name: Verify read-only event trust boundary
        uses: ./.github/actions/verify-trust-boundary
        with:
          policy-domain: ci
          event-name: ${{ github.event_name }}
          actor: ${{ github.actor }}
          triggering-actor: ${{ github.triggering_actor }}
          event-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          event-ref: ${{ github.ref }}
          pull-request-author: ${{ github.event.pull_request.user.login || github.actor }}
          allow-external-pull-request: 'true'
      - id: setup
        uses: ./.github/actions/setup-caxri-job
        with:
          setup-toolchain: 'true'
          install-dependencies: 'true'
          install-electron: ${{ needs.retry-policy.outputs.checks_scope == 'focused-source' || needs.retry-policy.outputs.checks_scope == 'affected' }}
          install-playwright-shell: ${{ needs.retry-policy.outputs.checks_scope == 'focused-source' || needs.retry-policy.outputs.checks_scope == 'affected' }}
          install-media-tools: ${{ needs.retry-policy.outputs.checks_scope == 'focused-source' || needs.retry-policy.outputs.checks_scope == 'affected' }}
      - name: Resolve the diff base
        # The checkout is the synthetic merge ref, so a pull request diffs against its verified first parent rather than
        # the payload base, which goes stale when `main` advances while the run is queued. Exported via GITHUB_ENV, so no
        # later step may override CAXRI_REACT_DOCTOR_BASE in its own `env`.
        env:
          CAXRI_CHECKS_BASE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CAXRI_CHECKS_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          CAXRI_GITHUB_TOKEN: ${{ github.token }}
        run: bun run scripts/ci-checks-diff-base.ts
      - name: Run gitleaks
        # Scoped to the commits this push or pull request actually introduced. Manual dispatches retain the
        # wrapper's intentional full-history audit when no base revision exists.
        if: needs.retry-policy.outputs.checks_scope != 'full'
        env:
          GITLEAKS_BASE_REVISION: >-
            ${{ github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || github.event_name == 'push'
              && github.event.before
              || '' }}
          GITLEAKS_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun run gitleaks
      - name: Run focused changed-file checks
        if: needs.retry-policy.outputs.checks_scope != 'full'
        env:
          CI_CHANGED_FILES: ${{ needs.retry-policy.outputs.changed_files }}
          CI_CHECKS_SCOPE: ${{ needs.retry-policy.outputs.checks_scope }}
        run: bun run scripts/run-ci-focused-checks.ts
      - name: Run full platform checks
        if: needs.retry-policy.outputs.checks_scope == 'full'
        env:
          ESLINT_CONCURRENCY: ${{ inputs.eslint_concurrency || 'off' }}
          GITLEAKS_BASE_REVISION: >-
            ${{ github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || github.event_name == 'push'
              && github.event.before
              || '' }}
          GITLEAKS_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun run scripts/ci-platform-checks.ts --skip-node-pty-preparation --skip-vitest --skip-eslint --skip-bundle-budget
  # Full-scope ESLint is the longest platform-neutral gate (about ten minutes serially on macos-15), so it runs on a
  # four-core Linux runner with worker concurrency, beside `checks` and outside the account's macOS concurrency limit.
  # Lifecycle scripts never run there, so no native module or Electron binary is involved.
  lint:
    name: lint
    needs: retry-policy
    if: >-
      needs.retry-policy.outputs.checks_scope == 'full' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.validation_target != 'hosted-full' ||
        needs.retry-policy.outputs.e2e_profile != 'optimized'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify hosted runner boundary before checkout
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify read-only event trust boundary
        uses: ./.github/actions/verify-trust-boundary
        with:
          policy-domain: ci
          event-name: ${{ github.event_name }}
          actor: ${{ github.actor }}
          triggering-actor: ${{ github.triggering_actor }}
          event-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          event-ref: ${{ github.ref }}
          pull-request-author: ${{ github.event.pull_request.user.login || github.actor }}
          allow-external-pull-request: 'true'
      - uses: ./.github/actions/setup-caxri-job
        with:
          setup-toolchain: 'true'
          install-dependencies: 'true'
      # ESLint has no type-aware rules (oxlint owns those), so its content-hashed cache stays valid across runs as long as
      # the dependency tree, config, and local rules match. Main-scoped entries seed the next main push.
      - name: Restore ESLint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.ts', 'scripts/eslint-rules/**') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.ts', 'scripts/eslint-rules/**') }}-
      - name: Run ESLint
        env:
          ESLINT_CONCURRENCY: auto
        run: >-
          bun run scripts/ci-metrics.ts --label "ESLint concurrency=$ESLINT_CONCURRENCY" --
          bun run lint --concurrency "$ESLINT_CONCURRENCY"
  # The bundle budget packages a macOS `dir` build with electron-builder, so it is the one full-scope gate that cannot
  # follow `checks` to Linux. It runs alone on macOS beside the other jobs.
  bundle-budget:
    name: bundle budget
    needs: retry-policy
    if: >-
      needs.retry-policy.outputs.checks_scope == 'full' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.validation_target != 'hosted-full' ||
        needs.retry-policy.outputs.e2e_profile != 'optimized'
      )
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CAXRI_EXPECTED_HEAD: ${{ github.sha }}
      CAXRI_RUNNER_AGENT_DISCOVERY: blocked
      # electron-builder skips code signing on pull request builds. The package is only ad-hoc signed (no certificate),
      # so sign here too: an ad-hoc signing change otherwise passes the PR and first fails on main.
      CSC_FOR_PULL_REQUEST: true
    steps:
      - name: Verify hosted runner boundary before checkout
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify read-only event trust boundary
        uses: ./.github/actions/verify-trust-boundary
        with:
          policy-domain: ci
          event-name: ${{ github.event_name }}
          actor: ${{ github.actor }}
          triggering-actor: ${{ github.triggering_actor }}
          event-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          event-ref: ${{ github.ref }}
          pull-request-author: ${{ github.event.pull_request.user.login || github.actor }}
          allow-external-pull-request: 'true'
      - uses: ./.github/actions/setup-caxri-job
        with:
          setup-toolchain: 'true'
          install-dependencies: 'true'
          install-electron: 'true'
      - name: Run bundle budget gate
        run: bun run scripts/ci-metrics.ts --label "Bundle budget gate" -- bun run scripts/ci-bundle-budget.ts
  # Vitest dominates both the `full` and `affected` scopes, so it runs in shards beside the lint and type gates instead
  # of after them. The CI gate requires every shard whenever `checks` runs one of those scopes.
  unit:
    name: unit (${{ matrix.shard }})
    needs: retry-policy
    if: >-
      (
        needs.retry-policy.outputs.checks_scope == 'full' ||
        needs.retry-policy.outputs.checks_scope == 'affected'
      ) &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.validation_target != 'hosted-full' ||
        needs.retry-policy.outputs.checks_scope != 'full' ||
        needs.retry-policy.outputs.e2e_profile != 'optimized'
      )
    strategy:
      fail-fast: true
      matrix:
        shard: [1/3, 2/3, 3/3]
    runs-on: macos-15
    env:
      CAXRI_EXPECTED_HEAD: ${{ github.sha }}
      CAXRI_RUNNER_AGENT_DISCOVERY: blocked
    steps:
      - name: Verify hosted runner boundary before checkout
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify read-only event trust boundary
        uses: ./.github/actions/verify-trust-boundary
        with:
          policy-domain: ci
          event-name: ${{ github.event_name }}
          actor: ${{ github.actor }}
          triggering-actor: ${{ github.triggering_actor }}
          event-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          event-ref: ${{ github.ref }}
          pull-request-author: ${{ github.event.pull_request.user.login || github.actor }}
          allow-external-pull-request: 'true'
      - uses: ./.github/actions/setup-caxri-job
        with:
          setup-toolchain: 'true'
          install-dependencies: 'true'
          install-electron: 'true'
          install-playwright-shell: 'true'
          install-media-tools: 'true'
      - name: Run sharded unit and integration tests
        env:
          CAXRI_VITEST_MAX_WORKERS: ${{ inputs.vitest_max_workers || '2' }}
          CAXRI_VITEST_PARTITION: ${{ inputs.vitest_partition || 'optimized' }}
          CAXRI_VITEST_SHARD: ${{ matrix.shard }}
          CI_CHANGED_FILES: ${{ needs.retry-policy.outputs.changed_files }}
          CI_CHECKS_SCOPE: ${{ needs.retry-policy.outputs.checks_scope }}
        run: bun run scripts/run-ci-unit-tests.ts
  hosted-smoke:
    name: Hosted macOS smoke
    needs: retry-policy
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.validation_target == 'hosted-smoke' &&
      needs.retry-policy.result == 'success'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      PW_TEST_REPORTER: ''
    steps:
      - name: Verify hosted runner boundary before checkout
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify privileged dispatch trust boundary
        uses: ./.github/actions/verify-trust-boundary
        with:
          policy-domain: ci
          event-name: ${{ github.event_name }}
          actor: ${{ github.actor }}
          triggering-actor: ${{ github.triggering_actor }}
          event-repository: ${{ github.repository }}
          event-ref: ${{ github.ref }}
          pull-request-author: ${{ github.actor }}
      - uses: ./.github/actions/setup-caxri-job
        with:
          setup-toolchain: 'true'
          install-dependencies: 'true'
          install-electron: 'true'
      - name: Run targeted Electron smoke
        env:
          # This spec never requests clipboard access. The disposable hosted desktop has no user clipboard to preserve,
          # so do not make its cold Swift/AppKit clipboard helper a prerequisite for the launch smoke.
          CAXRI_E2E_CLIPBOARD_PROTECTION: skip-hosted
        run: bun run test:smoke

  e2e:
    name: e2e
    timeout-minutes: 30
    outputs:
      full_checks_result: ${{ steps.full-checks-receipt.outcome }}
      renderer_performance_result: ${{ steps.renderer-performance.outcome }}
    needs: [retry-policy, checks]
    # Keep failed-dependency handling, but let superseded runs release their concurrency slot.
    # https://docs.github.com/en/actions/how-tos/troubleshoot-workflows#canceling-workflows
    if: >-
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.validation_target == 'hosted-full' &&
      needs.retry-policy.result == 'success' &&
      needs.retry-policy.outputs.run_e2e == 'true' &&
      (
        (
          needs.retry-policy.outputs.mode == 'full' &&
          (
            needs.checks.result == 'success' ||
            (
              needs.retry-policy.outputs.checks_scope == 'full' &&
              needs.retry-policy.outputs.e2e_profile == 'optimized' &&
              needs.checks.result == 'skipped'
            )
          )
        ) ||
        (
          (needs.retry-policy.outputs.mode == 'e2e-only' || needs.retry-policy.outputs.mode == 'e2e-repair') &&
          (
            (needs.retry-policy.outputs.checks_scope == 'skipped' && needs.checks.result == 'skipped') ||
            (needs.retry-policy.outputs.checks_scope != 'skipped' && needs.checks.result == 'success')
          )
        )
      )
    runs-on: macos-15
    env:
      CAXRI_E2E_AGENT_MODE: blocked
      CAXRI_E2E_PARALLEL_WORKERS: ${{ inputs.e2e_parallel_workers || '3' }}
      CAXRI_E2E_PROFILE: ${{ needs.retry-policy.outputs.e2e_profile }}
      CAXRI_E2E_RUNNER_KIND: github-hosted
      CAXRI_E2E_RUNNER_REASON: ${{ inputs.validation_target }}
      CAXRI_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # For pull_request workflows, GitHub defines github.sha as the synthetic merge commit captured
      # for this event. Fetch that immutable SHA directly instead of the moving refs/pull/*/merge ref.
      CAXRI_CHECKS_REVISION: ${{ github.sha }}
      CAXRI_RUNNER_AGENT_DISCOVERY: blocked
      CAXRI_RUNNER_OWNER: caxri-${{ github.run_id }}-${{ github.run_attempt }}-e2e
      PW_TEST_REPORTER: ''
    steps:
      - name: Verify hosted runner boundary before checkout
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
      - name: Prepare hosted E2E temporary root
        shell: bash
        run: |
          owner="$CAXRI_RUNNER_OWNER"
          [[ "$owner" =~ ^caxri-[0-9]+-[0-9]+-e2e$ ]]
          temporary_root="/private/tmp/$owner"
          test ! -e "$temporary_root"
          test ! -L "$temporary_root"
          umask 077
          mkdir "$temporary_root"
          printf '%s\n' "$owner" > "$temporary_root/.caxri-owner"
          {
            echo "TEMP=$temporary_root"
            echo "TMP=$temporary_root"
            echo "TMPDIR=$temporary_root"
          } >> "$GITHUB_ENV"
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # PR E2E must execute the same exact pushed head whose immutable receipt and tree were
          # validated by retry-policy. The PR base identity is checked separately by that policy.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify privileged dispatch trust boundary
        uses: ./.github/actions/verify-trust-boundary
        with:
          policy-domain: ci
          event-name: ${{ github.event_name }}
          actor: ${{ github.actor }}
          triggering-actor: ${{ github.triggering_actor }}
          event-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          event-ref: ${{ github.ref }}
          pull-request-author: ${{ github.event.pull_request.user.login || github.actor }}
      - id: setup
        uses: ./.github/actions/setup-caxri-job
        with:
          setup-toolchain: 'true'
          install-dependencies: 'true'
          install-electron: 'true'
          install-playwright-shell: ${{ needs.retry-policy.outputs.mode == 'full' && needs.retry-policy.outputs.checks_scope == 'full' && needs.retry-policy.outputs.e2e_profile == 'optimized' }}
          install-media-tools: 'true'
      - name: Report E2E runner route
        run: |
          {
            echo "## E2E runner route"
            echo
            echo "| Runner | Kind | Reason | Exact head |"
            echo "| --- | --- | --- | --- |"
            echo "| \`$RUNNER_NAME\` | \`$CAXRI_E2E_RUNNER_KIND\` | $CAXRI_E2E_RUNNER_REASON | \`$CAXRI_EXPECTED_HEAD\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record validation environment
        env:
          E2E_PROFILE: ${{ needs.retry-policy.outputs.e2e_profile }}
          RUNNER_LABELS: github-hosted,macOS,ARM64,macos-15
          VITEST_MAX_WORKERS: ${{ inputs.vitest_max_workers || '2' }}
          VITEST_PARTITION: ${{ inputs.vitest_partition || 'optimized' }}
          E2E_PARALLEL_WORKERS: ${{ inputs.e2e_parallel_workers || '3' }}
        run: |
          # JavaScript expands this template literal, not the shell.
          # shellcheck disable=SC2016
          NODE_VERSION="$(node --version)" \
            PNPM_VERSION="$(pnpm --version)" \
            LOCKFILE_SHA256="$(shasum -a 256 pnpm-lock.yaml | awk '{print $1}')" \
            bun -e 'console.log(`CAXRI_VALIDATION_ENV ${JSON.stringify({ bun: Bun.version, e2eParallelWorkers: process.env.E2E_PARALLEL_WORKERS, e2eProfile: process.env.E2E_PROFILE, exactHead: process.env.CAXRI_EXPECTED_HEAD, lockfileSha256: process.env.LOCKFILE_SHA256, node: process.env.NODE_VERSION, pnpm: process.env.PNPM_VERSION, runnerLabels: process.env.RUNNER_LABELS?.split(","), runnerName: process.env.RUNNER_NAME, vitestMaxWorkers: process.env.VITEST_MAX_WORKERS, vitestPartition: process.env.VITEST_PARTITION })}`)'
      - id: concurrent-full
        name: Execute synthetic-merge checks and exact-head E2E concurrently
        if: >-
          needs.retry-policy.outputs.mode == 'full' &&
          needs.retry-policy.outputs.checks_scope == 'full' &&
          needs.retry-policy.outputs.e2e_profile == 'optimized'
        env:
          CAXRI_CHECKS_BASE_FETCH_REF: >-
            ${{ github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || github.event_name == 'push'
              && github.event.before
              || format('refs/heads/{0}', github.event.repository.default_branch) }}
          CAXRI_CHECKS_BASE_REVISION: >-
            ${{ github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || github.event_name == 'push'
              && github.event.before
              || '' }}
          CAXRI_CHECKS_FETCH_REF: ${{ github.sha }}
          CAXRI_CHECKS_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          CAXRI_CHECKS_REQUIRE_MERGE: ${{ github.event_name == 'pull_request' }}
          CAXRI_GITHUB_TOKEN: ${{ github.token }}
          CAXRI_VITEST_MAX_WORKERS: ${{ inputs.vitest_max_workers || '2' }}
          CAXRI_VITEST_PARTITION: ${{ inputs.vitest_partition || 'optimized' }}
          ESLINT_CONCURRENCY: ${{ inputs.eslint_concurrency || 'off' }}
        run: |
          if [ -z "$CAXRI_CHECKS_REVISION" ] || [ -z "$CAXRI_CHECKS_FETCH_REF" ]; then
            echo "The workflow event is missing its immutable revision SHA" >&2
            exit 1
          fi
          bun run scripts/ci-concurrent-validation.ts run
      - id: full-checks-receipt
        name: Verify full platform checks
        if: >-
          always() &&
          needs.retry-policy.outputs.mode == 'full' &&
          needs.retry-policy.outputs.checks_scope == 'full' &&
          needs.retry-policy.outputs.e2e_profile == 'optimized'
        run: bun run scripts/ci-concurrent-validation.ts verify checks
      - id: auxiliary-receipt
        name: Verify E2E auxiliary contracts
        if: >-
          always() &&
          needs.retry-policy.outputs.mode == 'full' &&
          needs.retry-policy.outputs.checks_scope == 'full' &&
          needs.retry-policy.outputs.e2e_profile == 'optimized'
        run: bun run scripts/ci-concurrent-validation.ts verify e2e-auxiliary
      - id: parallel-safe-receipt
        name: Run parallel-safe pool
        if: >-
          always() &&
          needs.retry-policy.outputs.mode == 'full' &&
          needs.retry-policy.outputs.checks_scope == 'full' &&
          needs.retry-policy.outputs.e2e_profile == 'optimized'
        run: bun run scripts/ci-concurrent-validation.ts verify parallel-safe
      - id: desktop-exclusive-receipt
        name: Run desktop-exclusive pool
        if: >-
          always() &&
          needs.retry-policy.outputs.mode == 'full' &&
          needs.retry-policy.outputs.checks_scope == 'full' &&
          needs.retry-policy.outputs.e2e_profile == 'optimized'
        run: bun run scripts/ci-concurrent-validation.ts verify desktop-exclusive
      - name: Build Electron bundles
        id: e2e-build
        if: >-
          needs.retry-policy.outputs.mode != 'full' ||
          needs.retry-policy.outputs.checks_scope != 'full' ||
          needs.retry-policy.outputs.e2e_profile != 'optimized'
        run: bun run scripts/ci-metrics.ts --label "Electron Vite build" -- bun run build
      - name: Verify Server artifact native modules
        if: always() && steps.e2e-build.outcome == 'success'
        run: bun run scripts/ci-metrics.ts --label "Server artifact native compatibility" -- bun run spike:native
      - name: Run focused repair specs
        id: focused-repair
        if: always() && steps.e2e-build.outcome == 'success' && needs.retry-policy.outputs.e2e_profile == 'focused'
        env:
          CI_E2E_AFFECTED_FILES: ${{ needs.retry-policy.outputs.checks_scope == 'affected' && needs.retry-policy.outputs.changed_files || '' }}
          CI_E2E_POOL: ${{ needs.retry-policy.outputs.e2e_pool }}
          CI_E2E_REPEAT: ${{ needs.retry-policy.outputs.checks_scope == 'affected' && '1' || '3' }}
          CI_E2E_TESTS: ${{ needs.retry-policy.outputs.e2e_tests }}
        run: bun run scripts/run-e2e-repair.ts
      - name: Run one-worker control suite
        id: control
        if: always() && steps.e2e-build.outcome == 'success' && needs.retry-policy.outputs.e2e_profile == 'control'
        run: >-
          bun run scripts/ci-metrics.ts --label "Playwright control workers=1" --
          bun run scripts/run-e2e-pools.ts --pool control
      - name: Prove desktop worker interruption recovery
        id: failure-isolation
        if: always() && steps.e2e-build.outcome == 'success' && needs.retry-policy.outputs.e2e_profile == 'optimized'
        run: >-
          bun run scripts/ci-metrics.ts --label "Desktop worker interruption recovery" --
          bun run scripts/run-e2e-failure-isolation.ts
      - name: Prove bounded E2E failure census
        id: failure-census
        if: always() && steps.e2e-build.outcome == 'success' && needs.retry-policy.outputs.e2e_profile != 'focused'
        run: bun run scripts/run-e2e-census-fixture.ts
      - name: Run parallel-safe pool
        id: parallel-safe
        if: always() && steps.e2e-build.outcome == 'success' && needs.retry-policy.outputs.e2e_profile == 'optimized'
        run: >-
          bun run scripts/ci-metrics.ts --label "Playwright parallel-safe workers=${CAXRI_E2E_PARALLEL_WORKERS}" --
          bun run scripts/run-e2e-pools.ts --pool parallel-safe
      - name: Run desktop-exclusive pool
        id: desktop-exclusive
        if: always() && steps.e2e-build.outcome == 'success' && needs.retry-policy.outputs.e2e_profile == 'optimized'
        run: >-
          bun run scripts/ci-metrics.ts --label "Playwright desktop-exclusive workers=1" --
          bun run scripts/run-e2e-pools.ts --pool desktop-exclusive
      - name: Run deterministic CI-parity cases
        id: ci-parity
        if: always() && steps.e2e-build.outcome == 'success' && github.event_name == 'workflow_dispatch'
        run: bun run scripts/ci-metrics.ts --label "CI parity workers=1 repeat=3" -- bun run scripts/run-ci-parity.ts
      # `ci-concurrent-validation.ts run` exits zero after an abort, and a SIGTERM mid Electron launch leaves a
      # pending desktop lease handoff that would fail this gate with an unrelated lease error (issue #1852). A missing
      # `aborted` output (the step crashed before publishing it) also skips the gate.
      - name: Run Renderer performance gate
        id: renderer-performance
        if: >-
          always() &&
          (
            (steps.concurrent-full.outcome == 'success' && steps.concurrent-full.outputs.aborted == 'false') ||
            steps.control.outcome == 'success' ||
            steps.desktop-exclusive.outcome == 'success'
          )
        run: bun run benchmark:renderer
      # Reuses the profiling build `benchmark:renderer` just made instead of building again; the spec rejects any other
      # build mode, so a failed or skipped build fails here rather than measuring the wrong Renderer.
      - name: Run Agent Chat switch performance gate
        id: agent-chat-switch-performance
        if: always() && steps.renderer-performance.outcome != 'skipped'
        env:
          CAXRI_AGENT_CHAT_SWITCH_BENCHMARK: '1'
          CAXRI_E2E_OUTPUT_DIR: test-results/agent-chat-switch-performance
        run: bunx playwright test e2e/agent-chat-switch.performance.e2e.ts
      - name: Record actual E2E execution receipt
        id: execution-receipt
        if: always() && steps.e2e-build.outcome == 'success' && needs.retry-policy.outputs.e2e_profile != 'focused'
        run: >-
          bun run scripts/report-e2e-manifest.ts
          ${{ needs.retry-policy.outputs.e2e_profile == 'optimized' && 'parallel-safe desktop-exclusive' || 'control' }}
      # The committed baseline was derived from different runner hardware and is deliberately unarmed. Keep running
      # the comparison so it records an explicit unarmed verdict without blocking until macos-15 is recalibrated.
      - name: Run Renderer performance baseline gate
        id: renderer-performance-baseline
        if: always() && steps.renderer-performance.outcome != 'skipped'
        env:
          CI_CHANGED_FILES: ${{ needs.retry-policy.outputs.changed_files }}
        run: >-
          bun run scripts/performance-baseline-gate.ts --receipt
          test-results/receipts/renderer-performance.json --baseline scripts/performance-baseline.json
      # No runner-derived baseline exists yet, so this records a NO-BASELINE verdict until one is derived and armed
      # from the uploaded receipts (docs/ci-performance.md).
      - name: Run Agent Chat switch performance baseline gate
        id: agent-chat-switch-performance-baseline
        if: always() && steps.agent-chat-switch-performance.outcome != 'skipped'
        env:
          CI_CHANGED_FILES: ${{ needs.retry-policy.outputs.changed_files }}
        run: >-
          bun run scripts/performance-baseline-gate.ts --receipt
          test-results/receipts/agent-chat-session-switch.json
          --baseline scripts/performance-baseline.agent-chat-switch.json
      - name: Prepare public E2E receipts
        id: prepare-public-e2e-receipts
        if: always()
        run: bun run scripts/prepare-public-e2e-receipts.ts
      - name: Upload Renderer performance receipt
        if: >-
          always() &&
          steps.prepare-public-e2e-receipts.outcome == 'success' &&
          steps.renderer-performance.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: renderer-performance-receipt
          path: test-results/public-receipts/renderer-performance.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload Agent Chat switch performance receipt
        if: >-
          always() &&
          steps.prepare-public-e2e-receipts.outcome == 'success' &&
          steps.agent-chat-switch-performance.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-chat-switch-performance-receipt
          path: test-results/public-receipts/agent-chat-session-switch.json
          # A run that failed before writing its receipt already fails its own step.
          if-no-files-found: warn
          retention-days: 7
      # A concurrent-validation pool can fail its receipt check without ever starting: a sibling `checks` failure
      # aborts the run before this pool's turn, and `ci-concurrent-validation.json` records the pool as `null`. There is
      # nothing to upload then, so that branch waits for the pool's own receipt. The direct pool step always launched
      # `run-e2e-pools.ts`, which writes the receipt on every exit path including a SIGTERM abort.
      - name: Upload parallel-safe failure artifacts
        if: >-
          always() &&
          steps.prepare-public-e2e-receipts.outcome == 'success' &&
          (
            steps.parallel-safe.outcome == 'failure' ||
            (
              steps.parallel-safe-receipt.outcome == 'failure' &&
              hashFiles('test-results/receipts/parallel-safe.json') != ''
            )
          )
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-parallel-safe-failure-artifacts
          # Only schema-validated receipts may leave the runner. Playwright outputs can embed repository source and
          # Terminal snapshots even when their paths are redacted, so they remain on the disposable hosted machine.
          path: test-results/public-receipts/parallel-safe.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload desktop-exclusive failure artifacts
        if: >-
          always() &&
          steps.prepare-public-e2e-receipts.outcome == 'success' &&
          (
            steps.desktop-exclusive.outcome == 'failure' ||
            (
              steps.desktop-exclusive-receipt.outcome == 'failure' &&
              hashFiles('test-results/receipts/desktop-exclusive.json') != ''
            )
          )
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-desktop-exclusive-failure-artifacts
          path: test-results/public-receipts/desktop-exclusive.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload control failure artifacts
        if: >-
          always() &&
          steps.prepare-public-e2e-receipts.outcome == 'success' &&
          steps.control.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-control-failure-artifacts
          path: test-results/public-receipts/control.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove synthetic-merge checks worktree
        if: >-
          always() &&
          needs.retry-policy.outputs.mode == 'full' &&
          needs.retry-policy.outputs.checks_scope == 'full' &&
          needs.retry-policy.outputs.e2e_profile == 'optimized'
        run: bun run scripts/ci-checks-worktree.ts remove
      - name: Remove hosted E2E temporary root
        if: always()
        shell: bash
        run: |
          owner="$CAXRI_RUNNER_OWNER"
          [[ "$owner" =~ ^caxri-[0-9]+-[0-9]+-e2e$ ]]
          temporary_root="/private/tmp/$owner"
          if [[ -e "$temporary_root" || -L "$temporary_root" ]]; then
            test -d "$temporary_root"
            test ! -L "$temporary_root"
            test "$(cat "$temporary_root/.caxri-owner")" = "$owner"
            rm -rf -- "$temporary_root"
          fi
  ci:
    name: CI gate
    if: ${{ !cancelled() }}
    needs: [retry-policy, checks, lint, bundle-budget, unit, hosted-smoke, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required execution path
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          CHECKS_SCOPE: ${{ needs.retry-policy.outputs.checks_scope }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_PROFILE: ${{ needs.retry-policy.outputs.e2e_profile }}
          FULL_CHECKS_RESULT: ${{ needs.e2e.outputs.full_checks_result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUNDLE_BUDGET_RESULT: ${{ needs.bundle-budget.result }}
          RETRY_POLICY_RESULT: ${{ needs.retry-policy.result }}
          SMOKE_RESULT: ${{ needs.hosted-smoke.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          VALIDATION_TARGET: ${{ inputs.validation_target || 'automated' }}
        run: |
          test "$RETRY_POLICY_RESULT" = success
          if test "$CHECKS_SCOPE" = skipped; then
            test "$CHECKS_RESULT" = skipped
          elif test "$VALIDATION_TARGET" = hosted-full; then
            if test "$CHECKS_SCOPE" = full && test "$E2E_PROFILE" = optimized; then
              test "$CHECKS_RESULT" = skipped
              test "$FULL_CHECKS_RESULT" = success
            else
              test "$CHECKS_RESULT" = success
            fi
          else
            test "$CHECKS_RESULT" = success
          fi

          # The sharded unit job runs exactly when checks runs the full or affected scope.
          if { test "$CHECKS_SCOPE" = full || test "$CHECKS_SCOPE" = affected; } && test "$CHECKS_RESULT" != skipped; then
            test "$UNIT_RESULT" = success
          else
            test "$UNIT_RESULT" = skipped
          fi

          # The Linux lint and macOS bundle budget jobs run exactly when checks runs the full scope.
          if test "$CHECKS_SCOPE" = full && test "$CHECKS_RESULT" != skipped; then
            test "$LINT_RESULT" = success
            test "$BUNDLE_BUDGET_RESULT" = success
          else
            test "$LINT_RESULT" = skipped
            test "$BUNDLE_BUDGET_RESULT" = skipped
          fi

          case "$VALIDATION_TARGET" in
            hosted-smoke)
              test "$SMOKE_RESULT" = success
              test "$E2E_RESULT" = skipped
              ;;
            hosted-full)
              test "$SMOKE_RESULT" = skipped
              test "$E2E_RESULT" = success
              ;;
            automated|checks-only)
              test "$SMOKE_RESULT" = skipped
              test "$E2E_RESULT" = skipped
              ;;
            *)
              echo "Unknown validation target: $VALIDATION_TARGET" >&2
              exit 1
              ;;
          esac
