name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Platform-neutral gates stay on Linux so private-repository macOS minutes are reserved for
    # Electron behavior and release validation that actually depend on macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # React Doctor reports only issues new relative to the push/PR base; a shallow
          # checkout breaks that base detection and it falls back to reporting every
          # existing issue (https://www.react.doctor/docs/ci-and-prs/github-actions-setup).
          fetch-depth: 0
      - name: Restore PR branch context for changed-scope checks
        if: github.event_name == 'pull_request'
        # Pull-request checkout is detached; React Doctor otherwise falls back to a full scan.
        run: git switch --create "ci-pr-${{ github.event.pull_request.number }}"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: bun run lint
      - run: bun run knip
      - run: bun run doctor -- --scope changed
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run format:md:check
      - run: bun run test
      - run: bun run build

  e2e:
    needs: checks
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: v'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: bun run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            logs/
          if-no-files-found: ignore
